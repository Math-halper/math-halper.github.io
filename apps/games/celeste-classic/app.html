<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celeste Classic - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Celeste Classic</b>
from the proton menu. The script below is fetched and run by proton's HTML
loader (assets/html-loader.js) at boot.</p>
<!-- VENDORED GAME — proton's wrapper plus the actual Celeste Classic files.

     index.html, celeste.js and celeste.p8.png are copied byte-for-byte from
     Math-halper/Celeste (its classic/ folder), the PICO-8 export of Celeste
     Classic. Nothing in them was edited. The page's "all games" link goes
     one level up (href="../"), as on the source site; apps/games/index.html is the
     picker that link expects, remapped from that repository's root page.

     The wrapper frames this folder's own index.html — a local page, so the
     frame is NOT sandboxed and may use keyboard, audio and fullscreen like
     any desktop app. Only the game page's own external links (lexaloffle.com
     etc.) leave the repository, and only when clicked. -->
<script data-proton-app>
(() => {
/* proton app module: vendored game wrapper — edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md).
 * Metadata (name, icon, cat, desc, w, h) lives in data/applications.js. */
'use strict';

/* =====================================================================
   The game page that ships in this folder.
   ===================================================================== */
const GAME_PAGE = 'apps/games/celeste-classic/index.html';
/* --------------------------------------------------------------------- */

registerApp({
  render(body) {
    body.innerHTML = `${bar('Celeste Classic', `<span class="muted embed-src" title="${MH.esc(GAME_PAGE)}">${MH.esc(GAME_PAGE)}</span>
      <button class="btn sm" data-e="reload">${iconSvg('refresh')} Reload</button>
      <button class="btn sm primary" data-e="ext">${iconSvg('external')} Open in new tab</button>`)}
      <div class="app-main local-page"><iframe class="site-frame" title="Celeste Classic" src="${MH.esc(GAME_PAGE)}"
        allow="autoplay; fullscreen; pointer-lock; gamepad" allowfullscreen></iframe></div>
      <p class="muted" style="flex:none;margin:0;padding:7px 14px;border-top:1px solid var(--line)">The game files
        ship with this app — copied verbatim from <a href="https://github.com/Math-halper/Celeste" target="_blank"
        rel="noopener">Math-halper/Celeste</a>. Following the page's own links takes the frame away from the
        game; <b>Reload</b> brings it back.</p>`;
    const frame = body.querySelector('iframe');
    body.querySelector('[data-e="reload"]').onclick = () => { frame.src = GAME_PAGE; };
    body.querySelector('[data-e="ext"]').onclick = () => window.open(GAME_PAGE, '_blank', 'noopener');
  },
});
})();
</script>
<style>
/* The toolbar path, truncated like the Browser's. */
.embed-src{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
</style>
</body>
</html>
