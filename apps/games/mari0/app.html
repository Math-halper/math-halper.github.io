<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mari0 - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Mari0</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- VENDORED GAME — proton's wrapper plus the actual Mari0 build.

     Every file in this folder (index.html, love.js, love.wasm, game.js,
     game.data, and the bundled CREDITS.txt / LOVEJS-LICENSE.txt notices) is
     copied byte-for-byte from Math-halper/Mario (its mari0/web/ folder), the
     love.js browser build of Mari0 — Mario × Portal by Maurice Guégan /
     Stabyourself. Nothing here was edited; only the game build was taken —
     the collection's landing page, READMEs and other files were not.

     The wrapper frames this folder's own index.html — a local page, so the
     frame is NOT sandboxed and may use keyboard, mouse, audio and fullscreen
     like any desktop app. Click the game once to give it keyboard focus. -->
<script data-proton-app>
(() => {
/* proton app module: vendored game wrapper — edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md).
 * Metadata (name, icon, cat, desc, w, h) lives in data/applications.js. */
'use strict';

/* =====================================================================
   The game page that ships in this folder.
   ===================================================================== */
const GAME_PAGE = 'apps/games/mari0/index.html';
/* --------------------------------------------------------------------- */

registerApp({
  render(body) {
    body.innerHTML = `${bar('Mari0', `<span class="muted embed-src" title="${MH.esc(GAME_PAGE)}">${MH.esc(GAME_PAGE)}</span>
      <button class="btn sm" data-e="reload">${iconSvg('refresh')} Reload</button>
      <button class="btn sm primary" data-e="ext">${iconSvg('external')} Open in new tab</button>`)}
      <div class="app-main local-page"><iframe class="site-frame" title="Mari0" src="${MH.esc(GAME_PAGE)}"
        allow="autoplay; fullscreen; pointer-lock; gamepad" allowfullscreen></iframe></div>
      <p class="muted" style="flex:none;margin:0;padding:7px 14px;border-top:1px solid var(--line)">The game files
        ship with this app — copied verbatim from <a href="https://github.com/Math-halper/Mario" target="_blank"
        rel="noopener">Math-halper/Mario</a>. Mari0 is by
        <a href="https://github.com/Stabyourself/mari0" target="_blank" rel="noopener">Maurice Guégan / Stabyourself</a>
        (MIT); the browser runtime is love.js (MIT — see the notices in this folder).</p>`;
    const frame = body.querySelector('iframe');
    body.querySelector('[data-e="reload"]').onclick = () => { frame.src = GAME_PAGE; };
    body.querySelector('[data-e="ext"]').onclick = () => window.open(GAME_PAGE, '_blank', 'noopener');
  },
});
})();
</script>
<style>
/* The toolbar path, truncated like the Browser's. */
.embed-src{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
</style>
</body>
</html>
