<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celeste Classic 2 Practice Mod 1.1 - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Celeste Classic 2 Practice Mod 1.1</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- VENDORED GAME — proton's wrapper plus the game's own files.

     This app frames one page from the Celeste Community collection
     (apps/games/celeste-community/) so the page is its own game in the
     proton menu. The page and its builds stay in that shared folder,
     from Math-halper/Celeste (link fixes noted in CREDITS.md), so their
     relative script and image paths keep working.

     The wrapper frames the game page — a local page, so the
     frame is NOT sandboxed and may use keyboard, mouse, audio and fullscreen
     like any desktop app. Click the game once to give it keyboard focus. -->
<script data-proton-app>
(() => {
/* proton app module: vendored game wrapper — edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md).
 * Metadata (name, icon, cat, desc, w, h) lives in data/applications.js. */
'use strict';

/* =====================================================================
   The game page that ships with this app.
   ===================================================================== */
const GAME_PAGE = 'apps/games/celeste-community/cc2_practice_mod_1.1.html';
/* --------------------------------------------------------------------- */

registerApp({
  render(body) {
    body.innerHTML = `${bar('Celeste Classic 2 Practice Mod 1.1', `<span class="muted embed-src" title="${MH.esc(GAME_PAGE)}">${MH.esc(GAME_PAGE)}</span>
      <button class="btn sm" data-e="reload">${iconSvg('refresh')} Reload</button>
      <button class="btn sm primary" data-e="ext">${iconSvg('external')} Open in new tab</button>`)}
      <div class="app-main local-page"><iframe class="site-frame" title="Celeste Classic 2 Practice Mod 1.1" src="${MH.esc(GAME_PAGE)}"
        allow="autoplay; fullscreen; pointer-lock; gamepad" allowfullscreen></iframe></div>
      <p class="muted" style="flex:none;margin:0;padding:7px 14px;border-top:1px solid var(--line)">The game page
        ships with the Celeste Community app — copied verbatim from
        <a href="https://github.com/Math-halper/Celeste" target="_blank" rel="noopener">Math-halper/Celeste</a>.</p>`;
    const frame = body.querySelector('iframe');
    body.querySelector('[data-e="reload"]').onclick = () => { frame.src = GAME_PAGE; };
    body.querySelector('[data-e="ext"]').onclick = () => window.open(GAME_PAGE, '_blank', 'noopener');
  },
});
})();
</script>
<style>
/* The toolbar path, truncated like the Browser's. */
.embed-src{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
</style>
</body>
</html>
