<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampler Launcher - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Ampler Launcher</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- VENDORED GAME - proton's wrapper plus the launcher's own files.

     Every browser file in this folder except this wrapper is copied
     byte-for-byte from proton-arcade/proton-arcade.github.io
     (website/games/Ealgercraft/Ampler-Launcher, upstream of
     proton-arcade/AmplerLauncher with Alpha 1.2.6 and Beta 1.3 included).
     Non-browser CLI/server helper folders are omitted.

     The wrapper frames this folder's own launcher page - a local page, so the
     frame is NOT sandboxed and may use keyboard, mouse, audio and fullscreen
     like any desktop app. Pick any of the seven bundled Eaglercraft builds
     and press Play to launch it in a tab. -->
<script data-proton-app>
(() => {
/* proton app module: vendored game wrapper - edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md).
 * Metadata (name, icon, cat, desc, w, h) lives in data/applications.js. */
'use strict';

/* =====================================================================
   The game page that ships in this folder.
   ===================================================================== */
const GAME_PAGE = 'apps/games/ampler-launcher/index.html';
/* --------------------------------------------------------------------- */

registerApp({
  render(body) {
    body.innerHTML = `${bar('Ampler Launcher', `<span class="muted embed-src" title="${MH.esc(GAME_PAGE)}">${MH.esc(GAME_PAGE)}</span>
      <button class="btn sm" data-e="reload">${iconSvg('refresh')} Reload</button>
      <button class="btn sm primary" data-e="ext">${iconSvg('external')} Open in new tab</button>`)}
      <div class="app-main local-page"><iframe class="site-frame" title="Ampler Launcher" src="${MH.esc(GAME_PAGE)}"
        allow="autoplay; fullscreen; pointer-lock; gamepad" allowfullscreen></iframe></div>
      <p class="muted" style="flex:none;margin:0;padding:7px 14px;border-top:1px solid var(--line)">The launcher and all seven Eaglercraft builds ship with this app - copied verbatim from
        <a href="https://github.com/proton-arcade/proton-arcade.github.io" target="_blank" rel="noopener">proton-arcade/proton-arcade.github.io</a>
        (<a href="https://github.com/proton-arcade/AmplerLauncher" target="_blank" rel="noopener">proton-arcade/AmplerLauncher</a>).</p>`;
    const frame = body.querySelector('iframe');
    body.querySelector('[data-e="reload"]').onclick = () => { frame.src = GAME_PAGE; };
    body.querySelector('[data-e="ext"]').onclick = () => window.open(GAME_PAGE, '_blank', 'noopener');
  },
});
})();
</script>
<style>
/* The toolbar path, truncated like the Browser's. */
.embed-src{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
</style>
</body>
</html>
