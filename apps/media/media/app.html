<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLC - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>VLC</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: media — VLC for proton.
 *
 * This is a port of the open-source VLC media player to the proton
 * desktop: playback is done by libvlc (VLC's engine) compiled to
 * WebAssembly, vendored from the libvlc-wasm package under vendor/libvlc/
 * (MIT JavaScript SDK; the compiled libvlc engine is GPL — see
 * CREDITS.md). The interface follows desktop VLC: menus, a playlist
 * panel, a seek bar, play/pause/stop/previous/next, volume, playback
 * rate, repeat/shuffle, fullscreen, subtitles and track selection.
 * The window is dressed as the real thing too: the light-grey classic
 * VLC 3 chrome, its exact menu order (Media, Playback, Audio, Video,
 * Subtitle, Tools, View, Help) and the VideoLAN traffic cone
 * (data/icons/vlc.png) as the app icon and stage artwork.
 *
 * Keyboard control follows desktop VLC's default hotkeys (see Help →
 * Keyboard shortcuts in the app): Space play/pause, S stop, N/P
 * next/previous, B next audio track, V next subtitle track (Alt+V
 * reverse, Shift+V on/off), the Shift/Alt/Ctrl arrow seek ladders,
 * Ctrl+arrows for volume, H/G and J/K delay nudges, +/-/[/] speed,
 * L repeat, R shuffle, F fullscreen, and the rest of the VLC set that
 * the libvlc-wasm player can actually drive.
 *
 * libvlc's threads need SharedArrayBuffer, so the page has to be
 * cross-origin isolated. GitHub Pages cannot send the COOP/COEP headers
 * for that, so the app can load the root coi-serviceworker.js (the
 * isolation shim shipped with libvlc-wasm) and reload once; after that
 * the real VLC engine starts in a worker. Nothing is transcoded and
 * nothing is uploaded: VLC reads proton Files entries through
 * FS.readBlob() and device files as File objects, and plays them itself.
 */
'use strict';

registerApp({
  render(body, options) {
    const HOME = FS.home();
    const esc = MH.esc;
    const q = (s) => body.querySelector(s);
    const VLC_SDK = 'apps/media/media/vendor/libvlc/src/index.js';
    const MEDIA_EXTS = ['mp3', 'm4a', 'aac', 'flac', 'wav', 'ogg', 'oga', 'mp4', 'mov', 'webm', 'avi', 'ogv', 'mkv',
      'wmv', 'mpg', 'mpeg', 'm4v', '3gp', 'flv', 'rm', 'rmvb', 'asf', 'vob', 'ts', 'm2ts', 'mts', 'mid', 'midi', 'aif', 'aiff'];
    const ACCEPT = 'audio/*,video/*,' + MEDIA_EXTS.map((e) => '.' + e).join(',');

    let queue = [];              // [{name, kind:'vfs'|'device'|'url', path?, file?, url?}]
    let current = null;
    let currentIndex = -1;
    let vlc = null;
    let player = null;
    let enginePromise = null;
    let engineState = window.crossOriginIsolated ? 'ready to start' : 'needs cross-origin isolation';
    let playerState = 'idle';
    let repeatMode = 0;          // 0 off, 1 all, 2 one
    let shuffle = false;
    let destroyed = false;
    let timer = null;
    let seeking = false;
    /* VLC hotkey state (desktop VLC keeps the same kind of state per input). */
    let playbackRate = 1;
    let volumeLevel = 1;
    let mutedWanted = false;
    let audioDelay = 0;
    let subtitleDelay = 0;
    let subtitleScale = 1;
    let lastSubtitleTrackId = null;
    let subtitleMarks = { audio: null, subtitle: null };
    let aspectIndex = 0;
    let cropIndex = 0;
    let cropBorder = [0, 0, 0, 0]; // left, right, top, bottom (pixels)
    let deinterlaceOn = false;
    let deinterlaceModeIndex = 5;  // yadif, VLC's usual default mode
    let videoZoom = 1;
    let autoscale = true;
    let recording = false;
    let playlistBookmarks = Array(10).fill(null);

    const isMediaPath = (p) => !!FS.mediaKind(p) || MEDIA_EXTS.includes(FS.extname(p));
    const kindOfName = (name) => (['mp3', 'm4a', 'aac', 'flac', 'wav', 'ogg', 'oga', 'mid', 'midi', 'aif', 'aiff']
      .includes(String(name).split('.').pop().toLowerCase()) ? 'audio' : 'video');
    const fmt = (seconds) => {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const total = Math.floor(seconds);
      const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    };
    const guard = (p) => { if (p && typeof p.catch === 'function') p.catch(() => {}); return p; };

    body.innerHTML = `${bar('VLC', `<button class="btn sm" type="button" id="md-open">${iconSvg('folder-open')} Open…</button>
        <button class="btn sm" type="button" id="vlc-prev" title="Previous">${iconSvg('skip-back')}</button>
        <button class="btn sm" type="button" id="vlc-next" title="Next">${iconSvg('skip-forward')}</button>
        <button class="btn sm" type="button" id="md-download" disabled>${iconSvg('download')} Download</button>
        <button class="btn sm" type="button" id="md-files" disabled>${iconSvg('folder')} Show in Files</button>`)}
      <style>
        /* The classic VLC 3 look: light-grey Qt chrome, black video area
         * with the cone, VLC orange (#ff7900) accents. */
        .vlc-shell{display:flex;flex-direction:column;height:100%;background:#e8e8e8;color:#111;min-height:0;font-family:"Segoe UI",system-ui,sans-serif}
        .vlc-menus{display:flex;gap:2px;align-items:center;padding:3px 6px;background:linear-gradient(#fdfdfd,#ececec);border-bottom:1px solid #c6c6c6;flex-wrap:wrap}
        .vlc-menu{position:relative}.vlc-menu summary{list-style:none;cursor:pointer;padding:5px 10px;border-radius:3px;color:#111;user-select:none;font-size:13.5px}
        .vlc-menu summary::-webkit-details-marker{display:none}.vlc-menu summary:hover,.vlc-menu[open ] summary{background:#ff7900;color:#fff}
        .vlc-menu-items{position:absolute;z-index:30;top:calc(100% + 3px);left:0;min-width:220px;background:#fff;border:1px solid #b5b5b5;border-radius:4px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.30)}
        .vlc-menu-items button{display:flex;width:100%;text-align:left;background:none;border:0;color:#111;padding:7px 9px;border-radius:3px;cursor:pointer;font-size:13.5px}
        .vlc-menu-items button:hover{background:#ff7900;color:#fff}.vlc-menu-items button:disabled{opacity:.45;cursor:default}
        .vlc-engine{margin-left:auto;font-size:12px;color:#9a5200;padding:4px 6px}
        .vlc-main{display:flex;flex:1;min-height:0}.vlc-side{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid #c6c6c6;overflow:auto;padding:8px}
        .vlc-side h3{margin:2px 0 8px;font-size:13px;font-weight:600;color:#333}
        .vlc-item{display:flex;gap:7px;width:100%;align-items:center;background:none;border:0;border-radius:3px;color:#111;text-align:left;padding:6px 7px;cursor:pointer;font-size:13px}
        .vlc-item:hover{background:#f0f0f0}.vlc-item.sel{background:#ff7900;color:#fff}.vlc-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .vlc-stage-wrap{position:relative;flex:1;min-width:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
        #vlc-canvas{width:100%;height:100%;display:block;background:#000}
        .vlc-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:22px;background:#000;color:#fff}
        .vlc-overlay[hidden]{display:none}.vlc-overlay img{width:190px;height:auto}.vlc-overlay.vlc-art img{width:170px}
        .vlc-overlay h2{margin:0;font-size:24px;font-weight:600}.vlc-overlay p{max-width:560px;margin:0;color:#ddd;line-height:1.45;font-size:13.5px}
        .vlc-overlay .btn{background:#f4f4f4;color:#111;border:1px solid #bbb}.vlc-overlay .btn.primary{background:#ff7900;border-color:#ff9a33;color:#fff}
        .vlc-controls{padding:8px 10px 9px;background:linear-gradient(#f8f8f8,#e3e3e3);border-top:1px solid #c6c6c6}
        .vlc-seekrow,.vlc-btnrow{display:flex;align-items:center;gap:8px}.vlc-seekrow{margin-bottom:7px}
        .vlc-btnrow{flex-wrap:wrap}.vlc-time{font-variant-numeric:tabular-nums;font-size:12.5px;color:#111;min-width:118px;text-align:center}
        .vlc-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:36px;height:34px;padding:5px 9px;border-radius:4px;border:1px solid #b5b5b5;background:linear-gradient(#fdfdfd,#eaeaea);color:#111;cursor:pointer;font-size:13px}
        .vlc-btn:hover{border-color:#ff7900;background:#fff1e2}.vlc-btn.primary{background:#ff7900;color:#fff;border-color:#e56f00}.vlc-btn.primary:hover{background:#ff8c1a}
        .vlc-btn[aria-pressed="true"]{background:#ff7900;color:#fff;border-color:#e56f00}
        .vlc-btn svg{width:18px;height:18px}.vlc-spacer{flex:1}.vlc-vol{width:130px}.vlc-controls input[type=range]{accent-color:#ff7900}
        .vlc-speed{height:34px;background:#fff;color:#111;border:1px solid #b5b5b5;border-radius:4px}
        .vlc-note{padding:8px 10px;background:#fff3e2;color:#422600;border-bottom:1px solid #e5c99f;font-size:13px}.vlc-note[hidden]{display:none}
        .vlc-status{display:flex;gap:12px;align-items:center;padding:6px 10px;background:#ececec;border-top:1px solid #d2d2d2;color:#333;font-size:12.5px;min-height:30px}
        .vlc-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vlc-tracks{display:flex;gap:6px;flex-wrap:wrap;padding:7px 10px;background:#f4f4f4;border-top:1px solid #d8d8d8}
        .vlc-tracks[hidden]{display:none}.vlc-tracks label{font-size:12px;color:#111;display:flex;gap:5px;align-items:center}.vlc-tracks select{max-width:210px}
        .vlc-urlrow{display:flex;gap:7px}.vlc-urlrow input{flex:1}
        .vlc-shell.vlc-minimal .vlc-menus,.vlc-shell.vlc-minimal .vlc-side,.vlc-shell.vlc-minimal .vlc-tracks,.vlc-shell.vlc-minimal .vlc-controls,.vlc-shell.vlc-minimal .vlc-status,.vlc-shell.vlc-minimal .vlc-note{display:none!important}
        .vlc-shortcuts{line-height:1.65}.vlc-shortcuts b{color:#7a3c00}
        #vlc-canvas{transition:transform .15s ease}
        #vlc-stage-wrap:focus{outline:2px solid #ff7900;outline-offset:-2px}
        @media (max-width:720px){.vlc-side{display:none}.vlc-time{min-width:96px}.vlc-vol{width:86px}}
      </style>
      <div class="vlc-shell">
        <div class="vlc-menus" aria-label="VLC menus">
          <details class="vlc-menu" data-menu="media"><summary>Media</summary><div class="vlc-menu-items">
            <button type="button" data-act="open">Open file…</button>
            <button type="button" data-act="folder">Open folder…</button>
            <button type="button" data-act="url">Open URL…</button>
            <button type="button" data-act="files">Show in Files</button>
            <button type="button" data-act="download">Download / save copy…</button>
            <button type="button" data-act="save-playlist">Save playlist…</button>
            <button type="button" data-act="quit">Quit VLC</button>
          </div></details>
          <details class="vlc-menu" data-menu="playback"><summary>Playback</summary><div class="vlc-menu-items">
            <button type="button" data-act="play">Play / Pause</button>
            <button type="button" data-act="stop">Stop</button>
            <button type="button" data-act="prev">Previous</button>
            <button type="button" data-act="next">Next</button>
            <button type="button" data-act="goto">Go to time…</button>
          </div></details>
          <details class="vlc-menu" data-menu="audio"><summary>Audio</summary><div class="vlc-menu-items">
            <button type="button" data-act="mute">Mute / unmute</button>
            <button type="button" data-act="audio-track">Add audio track…</button>
          </div></details>
          <details class="vlc-menu" data-menu="video"><summary>Video</summary><div class="vlc-menu-items">
            <button type="button" data-act="fullscreen">Fullscreen</button>
            <button type="button" data-act="snapshot">Take snapshot</button>
          </div></details>
          <details class="vlc-menu" data-menu="subtitle"><summary>Subtitle</summary><div class="vlc-menu-items">
            <button type="button" data-act="subtitles">Add subtitle file…</button>
          </div></details>
          <details class="vlc-menu" data-menu="tools"><summary>Tools</summary><div class="vlc-menu-items">
            <button type="button" data-act="engine">Start VLC engine</button>
            <button type="button" data-act="enable">Enable VLC engine (reload once)</button>
            <button type="button" data-act="info">Media information</button>
            <button type="button" data-act="codec-info">Codec information</button>
            <button type="button" data-act="messages">Messages</button>
          </div></details>
          <details class="vlc-menu" data-menu="view"><summary>View</summary><div class="vlc-menu-items">
            <button type="button" data-act="playlist">Playlist</button>
            <button type="button" data-act="minimal">Minimal interface</button>
            <button type="button" data-act="fullscreen">Fullscreen</button>
          </div></details>
          <details class="vlc-menu" data-menu="help"><summary>Help</summary><div class="vlc-menu-items">
            <button type="button" data-act="shortcuts">Keyboard shortcuts</button>
            <button type="button" data-act="about">About this VLC port</button>
          </div></details>
          <span class="vlc-engine" id="vlc-engine-status">VLC engine: ${esc(engineState)}</span>
        </div>
        <div class="viewer-note vlc-note" id="vlc-note" hidden></div>
        <div class="vlc-main">
          <aside class="vlc-side" id="vlc-playlist" aria-label="Playlist"><h3>Playlist</h3><div id="vlc-playlist-items"></div></aside>
          <section class="vlc-stage-wrap" id="vlc-stage-wrap" tabindex="0" aria-label="VLC video stage. Click here, then use the VLC keyboard shortcuts: Space plays or pauses, B switches audio track, V switches subtitles.">
            <canvas id="vlc-canvas" width="960" height="540" aria-label="VLC video output"></canvas>
            <div class="vlc-overlay" id="vlc-overlay">
              <img src="data/icons/vlc.png" alt="VLC cone" draggable="false">
              <h2>VLC media player</h2>
              <p id="vlc-overlay-text">Open an audio or video file. Playback is by the open-source VLC engine (libvlc) compiled to WebAssembly — not by a separate converter.</p>
              <button class="btn primary" type="button" id="vlc-enable" hidden>Enable VLC engine</button>
              <button class="btn primary" type="button" id="vlc-start" hidden>Start VLC engine</button>
            </div>
          </section>
        </div>
        <div class="vlc-tracks" id="vlc-tracks" hidden>
          <label>Video <select id="vlc-track-video"></select></label>
          <label>Audio <select id="vlc-track-audio"></select></label>
          <label>Subtitles <select id="vlc-track-text"></select></label>
        </div>
        <div class="vlc-controls">
          <div class="vlc-seekrow">
            <span class="vlc-time" id="vlc-time">0:00 / 0:00</span>
            <input id="vlc-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" title="Seek. VLC jumps: Shift+←/→ 3 seconds, Alt+←/→ 10 seconds, Ctrl+←/→ 1 minute, Ctrl+Alt+←/→ 5 minutes" style="flex:1">
          </div>
          <div class="vlc-btnrow">
            <button class="vlc-btn primary" type="button" id="vlc-play" aria-label="Play or pause" title="Play / Pause (Space)" aria-keyshortcuts="Space">${iconSvg('play')}</button>
            <button class="vlc-btn" type="button" id="vlc-stop" aria-label="Stop" title="Stop (S)" aria-keyshortcuts="s">${iconSvg('square')}</button>
            <button class="vlc-btn" type="button" id="vlc-prev2" aria-label="Previous" title="Previous (P)" aria-keyshortcuts="p">${iconSvg('skip-back')}</button>
            <button class="vlc-btn" type="button" id="vlc-next2" aria-label="Next" title="Next (N)" aria-keyshortcuts="n">${iconSvg('skip-forward')}</button>
            <button class="vlc-btn" type="button" id="vlc-repeat" aria-label="Repeat" title="Repeat: off / all / one (L)" aria-keyshortcuts="l" aria-pressed="false">${iconSvg('repeat')}</button>
            <button class="vlc-btn" type="button" id="vlc-shuffle" aria-label="Shuffle" title="Shuffle (R)" aria-keyshortcuts="r" aria-pressed="false">${iconSvg('shuffle')}</button>
            <span class="vlc-spacer"></span>
            <label style="font-size:12.5px;color:#333">Speed <select class="vlc-speed" id="vlc-speed" aria-label="Playback speed" title="Playback speed (+ / − by 0.5×, [ / ] by 0.1×, = normal)">
              <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option>
              <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
            <button class="vlc-btn" type="button" id="vlc-mute" title="Mute / unmute (M)" aria-keyshortcuts="m">Mute</button>
            <label style="font-size:12.5px;color:#333">Volume <input class="vlc-vol" id="vlc-volume" type="range" min="0" max="200" value="100" step="1" aria-label="Volume" title="Volume (Ctrl+↑ / Ctrl+↓)"></label>
            <button class="vlc-btn" type="button" id="vlc-fullscreen" title="Fullscreen (F)" aria-keyshortcuts="f">Fullscreen</button>
          </div>
        </div>
        <div class="vlc-status" id="vlc-status"><span id="vlc-file-name">Nothing loaded</span><span id="vlc-status-text" style="margin-left:auto">VLC is idle.</span></div>
      </div>`;

    const note = q('#vlc-note'), overlay = q('#vlc-overlay'), overlayText = q('#vlc-overlay-text');
    const statusText = q('#vlc-status-text'), fileName = q('#vlc-file-name'), engineStatus = q('#vlc-engine-status');

    function say(html) { note.hidden = !html; note.innerHTML = html || ''; }
    function setEngineStatus(text) { engineState = text; engineStatus.textContent = `VLC engine: ${text}`; }
    function showArt() {
      overlay.hidden = false;
      overlay.classList.add('vlc-art');
      overlay.querySelector('h2').textContent = current ? current.name : 'VLC media player';
      overlayText.textContent = 'Playing with VLC';
      q('#vlc-enable').hidden = true;
      q('#vlc-start').hidden = true;
    }
    function settleOverlay() {
      if (current && kindOfName(current.name) === 'audio' && playerState === 'playing') showArt();
      else hideOverlay();
    }
    function showOverlay(title, text, mode) {
      overlay.classList.remove('vlc-art');
      overlay.hidden = false;
      overlay.querySelector('h2').textContent = title;
      overlayText.textContent = text;
      q('#vlc-enable').hidden = mode !== 'enable';
      q('#vlc-start').hidden = mode !== 'start';
    }
    function hideOverlay() { overlay.hidden = true; }
    let statusHoldUntil = 0;
    function status(text) { statusText.textContent = text; }
    /* Hotkey feedback is VLC's on-screen display; the status line plays
     * that role here, so hold it briefly before the progress line resumes. */
    function actionStatus(text) { statusText.textContent = text; statusHoldUntil = Date.now() + 3200; }
    function currentTitle() { return current ? current.name : 'Nothing loaded'; }

    /* ---------------- VLC hotkey helpers ----------------
     * The key handler at the bottom maps desktop VLC's default keys onto
     * these. Everything player-shaped goes through needPlayer() so a key
     * pressed before the engine exists explains itself instead of failing
     * silently. */
    function needPlayer(what) {
      if (player) return true;
      actionStatus(current ? `Start the VLC engine to ${what}.` : `Open media first to ${what}.`);
      return false;
    }
    function trackList(type) { return (player?.tracks || []).filter((t) => t.type === type); }
    function selectedTrack(type) { return trackList(type).find((t) => t.selected) || null; }
    function trackName(t) { return t?.name || t?.language || t?.codecName || t?.codec || t?.id || 'track'; }
    async function chooseTrack(type, track) {
      if (!needPlayer('switch tracks')) return;
      try {
        if (track) await player.selectTrack(track.id);
        else await player.disableTrack(type);
        for (const t of player.tracks || []) if (t.type === type) t.selected = !!track && t.id === track.id;
        if (type === 'text' && track) lastSubtitleTrackId = track.id;
        renderTracks();
      } catch (err) { actionStatus(`VLC could not switch tracks: ${err.message || err}`); }
    }
    function cycleAudioTrack() {
      if (!needPlayer('switch the audio track')) return;
      const list = trackList('audio');
      if (!list.length) { actionStatus('No audio tracks in this file.'); return; }
      const cur = selectedTrack('audio');
      const next = cur ? list[(list.indexOf(cur) + 1) % list.length] : list[0];
      chooseTrack('audio', next);
      actionStatus(`Audio track: ${trackName(next)}`);
    }
    function cycleSubtitleTrack(direction = 1) {
      if (!needPlayer('switch the subtitle track')) return;
      const list = trackList('text');
      if (!list.length) { actionStatus('No subtitle tracks in this file.'); return; }
      /* VLC cycles through "subtitles off" as one stop on the dial. */
      const choices = [null, ...list];
      let idx = choices.findIndex((t) => (t?.id || null) === (selectedTrack('text')?.id || null));
      if (idx < 0) idx = 0;
      const next = choices[(idx + direction + choices.length) % choices.length];
      chooseTrack('text', next);
      actionStatus(next ? `Subtitle track: ${trackName(next)}` : 'Subtitles off');
    }
    function toggleSubtitles() {
      if (!needPlayer('toggle subtitles')) return;
      const list = trackList('text');
      if (!list.length) { actionStatus('No subtitle tracks in this file.'); return; }
      const cur = selectedTrack('text');
      if (cur) {
        lastSubtitleTrackId = cur.id;
        chooseTrack('text', null);
        actionStatus('Subtitles off');
      } else {
        const next = list.find((t) => t.id === lastSubtitleTrackId) || list[0];
        chooseTrack('text', next);
        actionStatus(`Subtitle track: ${trackName(next)}`);
      }
    }
    function formatRate(r) { return `${Math.round(r * 100) / 100}×`; }
    function syncRateSelect() {
      const sel = q('#vlc-speed');
      const value = String(playbackRate);
      if (![...sel.options].some((o) => o.value === value)) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = formatRate(playbackRate);
        sel.insertBefore(opt, [...sel.options].find((o) => Number(o.value) > playbackRate) || null);
      }
      sel.value = value;
    }
    function setRate(rate, announce = true) {
      playbackRate = Math.min(8, Math.max(0.1, Math.round((Number(rate) || 1) * 10) / 10));
      syncRateSelect();
      if (player) player.rate = playbackRate;
      if (announce) actionStatus(`Speed: ${formatRate(playbackRate)}`);
    }
    function setVolume(volume, announce = true) {
      volumeLevel = Math.min(2, Math.max(0, Number(volume) || 0));
      q('#vlc-volume').value = String(Math.round(volumeLevel * 100));
      if (player) player.volume = volumeLevel;
      if (announce) actionStatus(`Volume ${Math.round(volumeLevel * 100)}%`);
    }

    }
    function openUrl(url) {
      const name = (() => { try { return decodeURIComponent(new URL(url).pathname.split('/').pop()) || url; } catch { return url; } })();
      setQueue([{ name, kind: 'url', url }], 0);
      openEntry(queue[0]);
    }
    function step(delta) {
      if (!queue.length) return;
      let next = currentIndex + delta;
      if (shuffle && queue.length > 1) { do { next = Math.floor(Math.random() * queue.length); } while (next === currentIndex); }
      if (next < 0 || next >= queue.length) {
        if (repeatMode === 1) next = (next + queue.length) % queue.length;
        else return;
      }
      openEntry(queue[next]);
    }
    function handleEnded() {
      if (!current) return;
      if (repeatMode === 2) { guard(player?.seek(0)); guard(player?.play()); return; }
      if (currentIndex + 1 < queue.length || repeatMode === 1) step(1);
      else playerState = 'stopped';
      syncChrome();
    }

    async function askOpen() {
      const src = await MH.askFileSource('open');
      if (src === 'device') {
        const file = await MH.devicePick(ACCEPT);
        openDevice(file);
      } else if (src === 'vfs') {
        const picked = await MH.vfsPick({ title: 'Open with VLC', accept: ACCEPT });
        if (picked) loadPath(picked);
      }
    }
    async function saveCopy() {
      if (!current) return;
      const dest = await MH.askFileSource('save');
      if (!dest) return;
      try {
        const blob = current.kind === 'device' ? current.file : current.kind === 'vfs' ? await FS.readBlob(current.path) : await (await fetch(current.url)).blob();
        if (dest === 'device') MH.downloadBlob(current.name, blob);
        else {
          const dir = FS.join(HOME, 'Downloads');
          let target = FS.join(dir, current.name);
          if (FS.exists(target)) {
            const dot = current.name.lastIndexOf('.');
            const base = dot > 0 ? current.name.slice(0, dot) : current.name, ext = dot > 0 ? current.name.slice(dot) : '';
            for (let i = 2; i < 500; i++) { const candidate = FS.join(dir, `${base} (${i})${ext}`); if (!FS.exists(candidate)) { target = candidate; break; } }
          }
          await FS.writeBlob(target, blob);
          MH.toast(`Saved to the proton file system: ${target}`);
        }
      } catch (err) { MH.toast(err.message); }
    }
    function showUrlForm() {
      say(`<div class="vlc-urlrow"><input id="vlc-url" type="url" placeholder="https://example.org/movie.mkv" aria-label="Media URL" autocomplete="off" spellcheck="false">
        <button class="btn sm primary" type="button" id="vlc-url-open">Open in VLC</button>
        <button class="btn sm" type="button" id="vlc-url-cancel">Cancel</button></div>`);
      const input = q('#vlc-url');
      q('#vlc-url-open').onclick = () => { const url = input.value.trim(); if (url) openUrl(url); else input.focus(); };
      q('#vlc-url-cancel').onclick = () => say('');
      input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); q('#vlc-url-open').click(); } };
      input.focus();
    }
    async function openFolder() {
      const src = await MH.askFileSource('open');
      if (src === 'vfs') {
        const dir = await MH.vfsPick({ title: 'Open folder in VLC', folder: true });
        if (!dir) return;
        const entries = FS.find('', dir).filter((e) => e.type === 'file' && isMediaPath(e.path))
          .map((e) => ({ name: e.name || FS.basename(e.path), kind: 'vfs', path: e.path }))
          .sort((a, b) => a.name.localeCompare(b.name));
        if (!entries.length) { MH.toast('No audio or video files in that folder.'); return; }
        setQueue(entries, 0);
        openEntry(queue[0]);
      } else if (src === 'device') {
        actionStatus('A browser file picker cannot queue a whole computer folder here; pick the first file instead.');
        askOpen();
      }
    }
    async function pasteLocation() {
      try {
        const text = await navigator.clipboard?.readText();
        if (text && /^https?:\/\//i.test(text.trim())) { openUrl(text.trim()); return; }
      } catch { /* clipboard unavailable or permission denied: use the form */ }
      showUrlForm();
      actionStatus('Paste a media URL, then choose Open in VLC.');
    }
    function parseClock(value) {
      const text = String(value ?? '').trim();
      if (/^\d+(?:\.\d+)?$/.test(text)) return Number(text);
      const parts = text.split(':').map(Number);
      if (parts.length < 2 || parts.length > 3 || parts.some((n) => !Number.isFinite(n) || n < 0)) return NaN;
      return parts.reduce((sum, n) => sum * 60 + n, 0);
    }
    function showGoToTimeForm() {
      if (!needPlayer('go to a specific time')) return;
      const dur = Number(player.duration) || 0;
      say(`<div class="vlc-urlrow"><label style="display:flex;gap:7px;align-items:center;flex:1">Go to
          <input id="vlc-goto" type="text" value="${esc(fmt(Number(player.currentTime) || 0))}" placeholder="1:23 or 83" aria-label="Go to time" autocomplete="off" spellcheck="false"></label>
        <span class="muted">/ ${esc(fmt(dur))}</span>
        <button class="btn sm primary" type="button" id="vlc-goto-open">Go</button>
        <button class="btn sm" type="button" id="vlc-goto-cancel">Cancel</button></div>`);
      const input = q('#vlc-goto');
      const go = () => {
        const secs = parseClock(input.value);
        if (!Number.isFinite(secs)) { actionStatus('Enter a time such as 1:23 or 83.'); input.focus(); return; }
        say('');
        seekTo(secs);
        q('#vlc-stage-wrap').focus();
      };
      q('#vlc-goto-open').onclick = go;
      q('#vlc-goto-cancel').onclick = () => { say(''); q('#vlc-stage-wrap').focus(); };
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); go(); }
        else if (e.key === 'Escape') { e.preventDefault(); say(''); q('#vlc-stage-wrap').focus(); }
      };
      input.focus();
      input.select();
    }
    async function addSlave(kind) {
      if (!player) { MH.toast('Start the VLC engine and open media first.'); return; }
      const file = await MH.devicePick(kind === 'subtitles' ? '.srt,.ass,.ssa,.vtt,.sub,.idx' : ACCEPT);
      if (!file) return;
      try {
        if (kind === 'subtitles') await player.addSubtitles(file);
        else await player.addAudioTrack(file, { select: true });
        MH.toast(kind === 'subtitles' ? 'Subtitle track added.' : 'Audio track added.');
        renderTracks();
      } catch (err) { MH.toast(err.message); }
    }
    function about() {
      say(`<b>VLC media player (open source)</b> — this proton app is a WebAssembly port of VLC's libvlc engine
        (libvlc-wasm: MIT SDK, GPL engine; see <b>CREDITS.md</b>). It plays files itself, including formats the
        browser cannot decode natively, and never uploads or transcodes them.`);
    }
    function doAction(act) {
      body.querySelectorAll('.vlc-menu[open]').forEach((d) => d.removeAttribute('open'));
      if (act === 'open') askOpen();
      else if (act === 'folder') openFolder();
      else if (act === 'url') showUrlForm();
      else if (act === 'files') { if (current?.kind === 'vfs') openApp('files', { path: FS.dirname(current.path), select: current.path }); }
      else if (act === 'download') saveCopy();
      else if (act === 'save-playlist') savePlaylist();
      else if (act === 'quit') quitVlc();
      else if (act === 'play') togglePlay();
      else if (act === 'stop') stopPlayback();
      else if (act === 'prev') step(-1);
      else if (act === 'next') step(1);
      else if (act === 'goto') showGoToTimeForm();
      else if (act === 'mute') toggleMute();
      else if (act === 'audio-track') addSlave('audio');
      else if (act === 'subtitles') addSlave('subtitles');
      else if (act === 'playlist') togglePlaylist();
      else if (act === 'minimal') toggleMinimal();
      else if (act === 'fullscreen') fullscreen();
      else if (act === 'snapshot') snapshot();
      else if (act === 'info') showMediaInfo(false);
      else if (act === 'codec-info') showMediaInfo(true);
      else if (act === 'messages') showMessages();
      else if (act === 'shortcuts') showShortcuts();
      else if (act === 'engine') ensureEngine().then(() => { if (current) openEntry(current); }).catch(() => {});
      else if (act === 'enable') enableIsolation();
      else if (act === 'about') about();
    }
    async function togglePlay() {
      if (!current) { askOpen(); return; }
      if (!player) { openEntry(current); return; }
      if (playerState === 'playing') await guard(player.pause());
      else await guard(player.play());
      syncChrome();
    }
    function fullscreen() {
      const wrap = q('#vlc-stage-wrap');
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (wrap.requestFullscreen) guard(wrap.requestFullscreen());
      } catch { /* fullscreen refused */ }
    }
    async function snapshot() {
      if (!player) { MH.toast('Nothing is playing in VLC yet.'); return; }
      try {
        const blob = await player.snapshot('image/png');
        if (blob) MH.downloadBlob('vlc-snapshot.png', blob);
      } catch (err) { MH.toast(err.message); }
    }

    q('#md-open').onclick = askOpen;
    q('#md-download').onclick = saveCopy;
    q('#md-files').onclick = () => { if (current?.kind === 'vfs') openApp('files', { path: FS.dirname(current.path), select: current.path }); };
    q('#vlc-enable').onclick = enableIsolation;
    q('#vlc-start').onclick = () => ensureEngine().then(() => { if (current) openEntry(current); }).catch(() => {});
    q('#vlc-play').onclick = togglePlay;
    q('#vlc-stop').onclick = stopPlayback;
    q('#vlc-prev').onclick = () => step(-1);
    q('#vlc-next').onclick = () => step(1);
    q('#vlc-prev2').onclick = () => step(-1);
    q('#vlc-next2').onclick = () => step(1);
    q('#vlc-repeat').onclick = cycleRepeat;
    q('#vlc-shuffle').onclick = toggleShuffle;
    q('#vlc-mute').onclick = toggleMute;
    q('#vlc-fullscreen').onclick = fullscreen;
    q('#vlc-volume').oninput = (e) => setVolume(Number(e.target.value) / 100, false);
    q('#vlc-speed').onchange = (e) => setRate(Number(e.target.value), false);
    q('#vlc-seek').oninput = () => { seeking = true; };
    q('#vlc-seek').onchange = (e) => { seeking = false; if (player && Number(player.duration) > 0) guard(player.seek((Number(e.target.value) / 1000) * Number(player.duration))); };
    q('#vlc-canvas').onclick = () => { if (current) togglePlay(); };
    body.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => doAction(b.dataset.act); });
    /* Desktop VLC's default keyboard shortcuts. They only act while focus
     * is inside this VLC window, and never while typing in a text field or
     * using a drop-down — VLC's own keys are bare letters, so that guard
     * is what keeps B/V/etc. out of the URL and Go-to-time boxes. */
    body.addEventListener('keydown', (e) => {
      if (destroyed) return;
      const target = e.target;
      const tag = target?.tagName;
      const inputType = target?.type || '';
      const editable = tag === 'TEXTAREA' || tag === 'SELECT' || !!target?.isContentEditable
        || (tag === 'INPUT' && !['range', 'checkbox', 'radio', 'button', 'submit', 'file'].includes(inputType));
      if (editable) return;
      const key = e.key || '';
      const codeLetter = /^Key([A-Z])$/.test(e.code || '') ? e.code.slice(3).toLowerCase() : '';
      const letter = key.length === 1 ? key.toLowerCase() : codeLetter;
      const ctrl = e.ctrlKey, meta = e.metaKey, alt = e.altKey, shift = e.shiftKey;
      const done = (fn) => { e.preventDefault(); e.stopPropagation(); if (fn) fn(); return true; };
      /* Space/Enter keep their native job on a focused button or menu. */
      if ((tag === 'BUTTON' || tag === 'SUMMARY' || target?.closest?.('summary')) && (key === ' ' || key === 'Enter')) return;
      /* Sliders keep their own arrow keys (except VLC's Ctrl+arrows). */
      if (tag === 'INPUT' && inputType === 'range' && !ctrl && !meta && !alt && (key === 'ArrowUp' || key === 'ArrowDown')) return;
      if (tag === 'INPUT' && inputType === 'range' && target.id === 'vlc-volume' && !ctrl && !meta && !alt && !shift && (key === 'ArrowLeft' || key === 'ArrowRight')) return;

      /* Multimedia keys (bound by VLC on Linux). */
      if (!ctrl && !meta && !alt) {
        if (key === 'MediaPlayPause') return done(togglePlay);
        if (key === 'MediaTrackNext') return done(() => step(1));
        if (key === 'MediaTrackPrevious') return done(() => step(-1));
        if (key === 'MediaStop') return done(stopPlayback);
        if (key === 'AudioVolumeUp') return done(() => adjustVolume(0.05));
        if (key === 'AudioVolumeDown') return done(() => adjustVolume(-0.05));
        if (key === 'AudioVolumeMute') return done(toggleMute);
        if (key === 'BrowserNext') return done(nextFrame);
        if (key === 'BrowserRefresh') return done(() => { if (playbackRate !== 1) setRate(1); else togglePlay(); });
        if (key === 'BrowserStop') return done(() => { if (player && playerState === 'playing') guard(player.pause()); });
      }

      if (key === 'Escape') {
        if (document.fullscreenElement) return done(() => guard(document.exitFullscreen()));
        const open = body.querySelector('.vlc-menu[open]');
        if (open) return done(() => open.removeAttribute('open'));
        if (!note.hidden) return done(() => say(''));
        return;
      }

      /* Playlist bookmarks: F1–F10 play, Ctrl+F1–F10 set. */
      const bookmark = /^F([1-9]|10)$/.exec(key);
      if (bookmark) {
        if (e.repeat) return done();
        const slot = Number(bookmark[1]) - 1;
        return done(() => {
          if (ctrl) {
            if (!current) { actionStatus('Nothing playing to bookmark.'); return; }
            playlistBookmarks[slot] = current;
            actionStatus(`Playlist bookmark ${slot + 1} set to ${current.name}.`);
          } else {
            const savedEntry = playlistBookmarks[slot];
            if (!savedEntry) { actionStatus(`Playlist bookmark ${slot + 1} is empty. Set it with Ctrl+F${slot + 1}.`); return; }
            const found = queue.find((item) => item === savedEntry
              || (item.kind === savedEntry.kind && ((item.path && item.path === savedEntry.path)
                || (item.url && item.url === savedEntry.url) || (item.file && item.file === savedEntry.file))));
            if (found) openEntry(found);
            else actionStatus('That bookmarked item is no longer in the playlist.');
          }
        });
      }
      if (key === 'F11') return done(fullscreen);
      if (key === 'F12') return;

      /* VLC's seek/volume ladders on the arrows. */
      if ((ctrl || meta) && (key === 'ArrowLeft' || key === 'ArrowRight')) {
        return done(() => seekBy((key === 'ArrowLeft' ? -1 : 1) * (alt ? 300 : 60)));
      }
      if ((ctrl || meta) && (key === 'ArrowUp' || key === 'ArrowDown')) {
        return done(() => adjustVolume(key === 'ArrowUp' ? 0.05 : -0.05));
      }
      if (alt && (key === 'ArrowLeft' || key === 'ArrowRight')) {
        return done(() => seekBy((key === 'ArrowLeft' ? -1 : 1) * 10));
      }
      if (ctrl && shift && letter === 'k') return done(resetSubtitleSync);
      if (ctrl && shift && letter === 'o') return done(askOpen);
      if (ctrl) {
        if (shift) return;
        if (key === '0') return done(() => setSubtitleScale(1));
        switch (letter) {
          case 'o': return done(askOpen);
          case 'f': return done(openFolder);
          case 'n': return done(showUrlForm);
          case 'v': return done(pasteLocation);
          case 't': return done(showGoToTimeForm);
          case 'l': return done(togglePlaylist);
          case 'h': return done(toggleMinimal);
          case 'w': return done(clearPlaylist);
          case 'y': return done(savePlaylist);
          case 'i': return done(() => showMediaInfo(false));
          case 'j': return done(() => showMediaInfo(true));
          case 'm': return done(showMessages);
          case 'p': return done(showShortcuts);
          case 'q': return done(quitVlc);
          default: return;
        }
      }
      if (meta) return;
      if (alt) {
        if (letter === 'v') return done(() => { if (!e.repeat) cycleSubtitleTrack(-1); });
        if (letter === 'o') return done(() => setVideoZoom(videoZoom + (shift ? -0.1 : 0.1)));
        if (letter === 'r' || letter === 'd' || letter === 'c' || letter === 'f') {
          const side = { r: 2, d: 0, c: 3, f: 1 }[letter];
          return done(() => cropPixel(side, shift ? -1 : 1));
        }
        if (/^[1-4]$/.test(key)) return done(() => setVideoZoom([0.25, 0.5, 1, 2][Number(key) - 1]));
        const menu = { m: 'media', l: 'playback', a: 'audio', t: 'subtitle', s: 'tools', i: 'view', h: 'help' }[letter];
        if (menu) return done(() => openMenu(menu));
        return;
      }
      if (shift && (key === 'ArrowLeft' || key === 'ArrowRight')) {
        return done(() => seekBy((key === 'ArrowLeft' ? -1 : 1) * 3));
      }

      if (key === ' ' || key === 'Spacebar') {
        if (e.repeat) return done();
        return done(togglePlay);
      }
      if (key === 'Enter') {
        if (player?.inMenu) return done(() => navigateMenu('activate'));
        return;
      }
      if (key === '+') return done(() => setRate(playbackRate + 0.5));
      if (key === '-') return done(() => setRate(playbackRate - 0.5));
      if (key === '=') return done(() => setRate(1));
      if (key === ']') return done(() => setRate(playbackRate + 0.1));
      if (key === '[') return done(() => setRate(playbackRate - 0.1));
      if (key === 'PageUp') return done(() => setVideoZoom(videoZoom + 0.1));
      if (key === 'PageDown') return done(() => setVideoZoom(videoZoom - 0.1));
      if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
        if (player?.inMenu) {
          const action = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[key];
          return done(() => navigateMenu(action));
        }
        if (key === 'ArrowLeft') return done(() => seekBy(-10));
        if (key === 'ArrowRight') return done(() => seekBy(10));
        return;
      }
      if (!letter) return;

      if (shift) {
        if (e.repeat) return done();
        switch (letter) {
          case 'h': return done(() => markSubtitleSync('audio'));
          case 'j': return done(() => markSubtitleSync('subtitle'));
          case 'k': return done(applySubtitleSync);
          case 'v': return done(toggleSubtitles);
          case 'a': return done(() => actionStatus('Only one audio output is available in the browser, so there is no next audio device to cycle to.'));
          case 'd': return done(cycleDeinterlaceMode);
          case 's': return done(snapshot);
          case 'r': return done(toggleRecording);
          case 'm': return done(discMenu);
          case 'o': return done(() => stepTitle(-1));
          case 'b': return done(() => stepTitle(1));
          case 'p': return done(() => stepChapter(-1));
          case 'n': return done(() => stepChapter(1));
          case 'x': return done(() => cycleProgram(-1));
          case 'z': return done(() => cycleVideoZoom(-1));
          default: return;
        }
      }

      /* Holding a letter down should not machine-gun track switches. */
      if (e.repeat && letter !== 'h' && letter !== 'g' && letter !== 'k' && letter !== 'j') return done();
      switch (letter) {
        case 's': return done(stopPlayback);
        case 'n': return done(() => step(1));
        case 'p': return done(() => step(-1));
        case 't': return done(showPosition);
        case 'e': return done(nextFrame);
        case 'f': return done(fullscreen);
        case 'm': return done(toggleMute);
        case 'b': return done(cycleAudioTrack);
        case 'v': return done(() => cycleSubtitleTrack(1));
        case 'x': return done(() => cycleProgram(1));
        case 'a': return done(cycleAspectRatio);
        case 'c': return done(cycleCropRatio);
        case 'o': return done(toggleAutoscale);
        case 'd': return done(toggleDeinterlace);
        case 'i': return done(() => actionStatus('The controls sit under the video. F toggles fullscreen; Esc leaves it.'));
        case 'w': return done(() => actionStatus('Wallpaper mode is not available inside proton.'));
        case 'r': return done(toggleShuffle);
        case 'l': return done(cycleRepeat);
        case 'h': return done(() => adjustSubtitleDelay(0.05));
        case 'g': return done(() => adjustSubtitleDelay(-0.05));
        case 'k': return done(() => adjustAudioDelay(0.05));
        case 'j': return done(() => adjustAudioDelay(-0.05));
        default: return;
      }
    });
    /* Ctrl+mouse wheel scales subtitle text, as in VLC. */
    q('#vlc-stage-wrap').addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      setSubtitleScale(subtitleScale * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, { passive: false });

    timer = setInterval(updateProgress, 500);
    body.openPath = ({ path: p } = {}) => { if (p) loadPath(p); };
    body.onDestroy = () => {
      destroyed = true;
      if (timer) clearInterval(timer);
      if (vlc) guard(vlc.destroy());
      player = null;
      vlc = null;
    };

    setQueue(vfsPlaylist(), -1);
    if (options.path) loadPath(options.path);
    else if (!window.crossOriginIsolated) showOverlay('VLC media player', 'Open an audio or video file. VLC needs one reload with its cross-origin isolation shim before libvlc can start; after that, files play in the real VLC engine.', 'enable');
    else showOverlay('VLC media player', 'Open an audio or video file, or start the VLC engine. Playback is by libvlc compiled to WebAssembly.', 'start');
    syncRateSelect();
    syncChrome();
  },
});
</script>
</body>
</html>
