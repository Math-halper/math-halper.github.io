<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Media</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: media — audio and video player for the virtual file
 * system. Loaded by index.html; calls registerApp() (see apps/README.md).
 *
 * FS.mediaKind() decides between <audio> and <video>: mp3, m4a, aac, flac, wav,
 * ogg and oga play as audio; mp4, mov, webm, avi, ogv and mkv as video.
 * Anything the browser still cannot decode is transcoded on-device by
 * the vendored FFmpeg (vendor/, see CREDITS.md) when you ask it to. Bytes come
 * from FS.readBlob() and are handed to the browser's own codecs through a blob
 * URL — this site has no player library and adds no dependencies, so what your
 * browser can decode is what plays here (and what it cannot is reported, not
 * guessed at).
 *
 * The blob URL is revoked when another file replaces it and when the window
 * closes (body.onDestroy), which also stops playback; nothing is uploaded.
 */
'use strict';

registerApp({
  render(body, options) {
    const HOME = FS.home();
    let path = null, url = null, token = 0, loop = false;
    let deviceBlob = null, deviceName = '';   // opened from the device ("your Files")
    const isMedia = (p) => !!FS.mediaKind(p);
    const esc = MH.esc;
    const q = (s) => body.querySelector(s);

    function revoke() {
      if (url) { URL.revokeObjectURL(url); url = null; }
    }
    /* The playlist: media files sitting next to this one, or everything in
     * your home folder when nothing is open yet. */
    function playlist() {
      try {
        const near = path ? FS.list(FS.dirname(path)).filter((e) => e.type === 'file' && isMedia(e.path)).map((e) => e.path) : [];
        if (near.length) return near;
        return FS.find('', HOME).filter((e) => e.type === 'file' && isMedia(e.path)).map((e) => e.path).sort();
      } catch { return path ? [path] : []; }
    }
    function drawPlaylist() {
      const list = playlist();
      q('#md-side').innerHTML = `<h3>Playlist</h3>` + (list.length
        ? list.map((p) => `<button type="button" class="fm-place${p === path ? ' sel' : ''}" data-play="${esc(p)}">
            ${iconSvg(FS.mediaKind(p) === 'audio' ? 'music' : 'film')}<span>${esc(FS.basename(p))}</span></button>`).join('')
        : `<p class="muted" style="padding:4px 9px;font-size:12.5px">No media in this folder. Import audio or video with <b>Files → Import</b>.</p>`);
      q('#md-side').querySelectorAll('[data-play]').forEach((b) => { b.onclick = () => load(b.dataset.play); });
      q('#md-prev').disabled = list.length < 2;
      q('#md-next').disabled = list.length < 2;
    }
    function statusLine() {
      const st = path ? FS.stat(path) : null;
      const el = q('#md-el');
      const time = el && Number.isFinite(el.duration) && el.duration
        ? `${Math.floor(el.duration / 60)}:${String(Math.floor(el.duration % 60)).padStart(2, '0')}` : '';
      status.innerHTML = st
        ? `<span>${esc(st.path)}</span><span>${MH.fmtBytes(st.size)}</span>
           <span>${FS.mediaKind(st.path) === 'audio' ? 'Audio' : 'Video'}${time ? ' · ' + time : ''}</span>
           <span style="margin-left:auto">${loop ? 'Repeat on' : 'Repeat off'} · ${st.user ? 'your account' : 'read-only system file'}</span>`
        : deviceName
          ? `<span>${esc(deviceName)}</span><span>${deviceBlob ? MH.fmtBytes(deviceBlob.size) : ''}</span>
           <span>${time ? time + ' · ' : ''}your Files (this computer)</span>
           <span style="margin-left:auto">${loop ? 'Repeat on' : 'Repeat off'}</span>`
          : `<span>Nothing playing</span><span style="margin-left:auto">MP3 · M4A · AAC · FLAC · WAV · OGG · MP4 · MOV · WebM · AVI</span>`;
    }
    function sync() {
      q('#md-download').disabled = !path && !deviceBlob;
      q('#md-files').disabled = !path;
      q('#md-loop').disabled = !path && !deviceBlob;
      q('#md-loop').innerHTML = loop ? `${iconSvg('repeat')} Repeat on` : `${iconSvg('repeat')} Repeat`;
      drawPlaylist();
      statusLine();
    }

    body.innerHTML = `${bar('Media', `<button class="btn sm" type="button" id="md-open">${iconSvg('folder-open')} Open…</button>
        <button class="btn sm" type="button" id="md-prev" title="Previous in playlist">${iconSvg('skip-back')}</button>
        <button class="btn sm" type="button" id="md-next" title="Next in playlist">${iconSvg('skip-forward')}</button>
        <button class="btn sm" type="button" id="md-loop" disabled>${iconSvg('repeat')} Repeat</button>
        <button class="btn sm" type="button" id="md-download" disabled>${iconSvg('download')} Download</button>
        <button class="btn sm" type="button" id="md-files" disabled>${iconSvg('folder')} Show in Files</button>`)}
      <div class="viewer-note" id="md-note" hidden></div>
      <div class="app-main fm-body"><div class="split">
        <div class="side fm-side" id="md-side"></div>
        <div class="viewer" id="md-stage"></div>
      </div></div>
      <div class="fm-status" id="md-status"></div>`;

    const stage = q('#md-stage'), note = q('#md-note'), status = q('#md-status');

    function say(html) {
      note.hidden = !html;
      note.innerHTML = html || '';
    }
    function startScreen(message = '') {
      path = null;
      deviceBlob = null; deviceName = '';
      revoke();
      say(message || `<b>Media</b> — import audio or video with <b>Files → Import</b>, then play it here. Playback uses
        your browser's own codecs: proton adds no player library and streams nothing anywhere.`);
      stage.innerHTML = `<div class="viewer-stage"><div class="fm-empty">${iconSvg('music')}
        <p>Nothing playing.</p><p class="muted" style="font-size:12.5px">Choose a file from the playlist, or use <b>Open…</b>.
        Files up to ${Math.round(FS.MAX_BLOB_SIZE / 1048576)} MB can be stored in this browser — larger media is best
        played straight from your computer.</p></div></div>`;
      sync();
    }
    /* ---- codec conversion (vendored FFmpeg, WebAssembly) ----
     * Playback above is native: the browser either has the codec or it
     * has not. When it has not, the fallback is to transcode the file
     * here on the device with the vendored ffmpeg-core (see vendor/ and
     * CREDITS.md) — video to H.264/AAC MP4, audio to MP3 — and play the
     * result. Nothing is uploaded; the conversion costs time and memory
     * roughly proportional to the file, and can be cancelled. */
    const FFMPEG_VENDOR = 'apps/media/media/vendor/';
    let ffmpegPromise = null;
    let progressCb = null;
    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Could not load ${src}`));
        document.head.appendChild(s);
      });
    }
    function getFfmpeg() {
      if (!ffmpegPromise) {
        ffmpegPromise = (async () => {
          await loadScriptOnce(FFMPEG_VENDOR + 'ffmpeg.js');
          const ff = new window.FFmpegWASM.FFmpeg();
          ff.on('progress', ({ progress }) => { if (progressCb) progressCb(progress); });
          await ff.load({
            coreURL: new URL(FFMPEG_VENDOR + 'ffmpeg-core.js', document.baseURI).href,
            wasmURL: new URL(FFMPEG_VENDOR + 'ffmpeg-core.wasm', document.baseURI).href,
          });
          return ff;
        })();
        ffmpegPromise.catch(() => { ffmpegPromise = null; });
      }
      return ffmpegPromise;
    }
    async function convertAndPlay(blob, name, kind, mine) {
      const isAudio = kind === 'audio';
      const ext = (name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
      const inName = `input.${ext}`;
      const outName = isAudio ? 'output.mp3' : 'output.mp4';
      stage.innerHTML = `<div class="viewer-stage"><div class="fm-empty">${iconSvg('film')}
        <p>Converting <b>${esc(name)}</b> to ${isAudio ? 'MP3' : 'MP4 (H.264/AAC)'}…</p>
        <progress id="md-conv-bar" max="1" value="0" style="width:min(420px,80%)"></progress>
        <p class="muted" style="font-size:12.5px">Conversion happens on this device and can take a while
        ${blob.size > 150 * 1048576 ? ' — this is a large file, so expect several minutes' : ''}. Nothing is uploaded.</p>
        <p><button type="button" class="btn sm" id="md-conv-cancel">Cancel</button></p></div></div>`;
      say(`Converting <b>${esc(name)}</b> with the built-in FFmpeg…`);
      let cancelled = false;
      q('#md-conv-cancel').onclick = () => { cancelled = true; };
      try {
        const ff = await getFfmpeg();
        if (cancelled || mine !== token) { return; }
        progressCb = (p) => {
          const bar = q('#md-conv-bar');
          if (bar) bar.value = Math.max(0, Math.min(1, p));
          if (cancelled) ff.terminate();
        };
        await ff.writeFile(inName, new Uint8Array(await blob.arrayBuffer()));
        const args = isAudio
          ? ['-i', inName, '-vn', '-c:a', 'libmp3lame', '-q:a', '3', outName]
          : ['-i', inName, '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
             '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '160k', '-movflags', '+faststart', outName];
        const code = await ff.exec(args);
        progressCb = null;
        if (cancelled) throw new Error('Conversion cancelled.');
        if (code !== 0) throw new Error(`FFmpeg could not convert this file (exit ${code}).`);
        const data = await ff.readFile(outName);
        await ff.deleteFile(inName).catch(() => {});
        await ff.deleteFile(outName).catch(() => {});
        if (mine !== token) return;
        revoke();
        url = URL.createObjectURL(new Blob([data], { type: isAudio ? 'audio/mpeg' : 'video/mp4' }));
        stage.innerHTML = `<div class="viewer-stage"><${kind} id="md-el" controls autoplay preload="metadata"
          aria-label="${esc(name)} (converted)"></${kind}></div>`;
        const el = q('#md-el');
        el.onloadedmetadata = () => { if (mine === token) statusLine(); };
        el.src = url;
        say(`<b>${esc(name)}</b> — converted to ${isAudio ? 'MP3' : 'MP4'} on this device because the browser lacks its codec.`);
        statusLine();
      } catch (err) {
        progressCb = null;
        ffmpegPromise = null;
        if (mine !== token) return;
        stage.innerHTML = `<div class="viewer-stage"><div class="fm-empty">${iconSvg('alert')}
          <p>Could not convert <b>${esc(name)}</b>.</p>
          <p class="muted" style="font-size:12.5px">${esc(err.message || String(err))} The original file is untouched.</p></div></div>`;
        statusLine();
      }
    }
    function convertPrompt(blob, name, kind, mine, whyHtml) {
      stage.innerHTML = `<div class="viewer-stage"><div class="fm-empty">${iconSvg('alert')}
        <p>This browser cannot play <b>${esc(name)}</b> — the codec is missing here.</p>
        ${whyHtml}
        <p><button type="button" class="btn sm primary" id="md-convert">Convert &amp; play</button></p>
        <p class="muted" style="font-size:12.5px">Conversion runs entirely on this device (built-in FFmpeg);
        the original file is not changed.</p></div></div>`;
      q('#md-convert').onclick = () => convertAndPlay(blob, name, kind, mine);
      statusLine();
    }

    async function load(p) {
      const target = FS.normalize(p);
      const st = FS.stat(target);
      if (!st || st.type !== 'file') { MH.toast(`No such file: ${target}`); return; }
      const kind = FS.mediaKind(target);
      if (!kind) { MH.toast(`${FS.basename(target)} is not audio or video — Files opens it with the right app.`); return; }
      const mine = ++token;
      path = target;
      deviceBlob = null; deviceName = '';
      say(`Opening <b>${esc(target)}</b>…`);
      sync();
      try {
        const blob = await FS.readBlob(target);
        if (mine !== token) return; // a newer file won
        revoke();
        url = URL.createObjectURL(blob);
        stage.innerHTML = `<div class="viewer-stage"><${kind} id="md-el" controls preload="metadata" ${loop ? 'loop' : ''}
          aria-label="${esc(FS.basename(target))}"></${kind}></div>`;
        const el = q('#md-el');
        el.onloadedmetadata = () => { if (mine === token) statusLine(); };
        el.onended = () => { if (mine === token && !loop) step(1); };
        el.onerror = () => {
          if (mine !== token) return;
          revoke();
          convertPrompt(blob, FS.basename(target), kind, mine, `
            <p class="muted" style="font-size:12.5px">(${esc(blob.type || FS.mime(target))}) Download it and play it with an app on your
            computer, or convert it here — the file itself is fine, only the codec is missing.</p>${FS.extname(target) === 'mkv' ? `
            <p class="muted" style="font-size:12.5px">MKV is only a container: the picture and sound inside still need
            codecs this browser has (H.264 with AAC usually plays; HEVC, AV1 or DTS often does not).</p>` : ''}`);
        };
        el.src = url;
        say(`<b>${esc(target)}</b> · ${esc(blob.type || FS.mime(target))} · playing from your account's file system, not the network.`);
        statusLine();
      } catch (err) {
        if (mine !== token) return;
        path = null;
        startScreen('');
        MH.toast(`Could not open ${FS.basename(target)}: ${err.message}`);
      }
    }
    function step(delta) {
      const list = playlist();
      if (!list.length) return;
      const at = path ? list.indexOf(path) : -1;
      load(list[(at + delta + list.length) % list.length]);
    }
    function askOpen() {
      MH.askFileSource('open').then((src) => {
        if (src === 'device') openDeviceMedia();
        else if (src === 'vfs') askOpenVfs();
      });
    }
    async function openDeviceMedia() {
      const file = await MH.devicePick('audio/*,video/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.mp4,.mov,.webm,.avi,.mkv');
      if (!file) return;
      const kind = FS.mediaKind(file.name) || (/^audio\//i.test(file.type) ? 'audio' : 'video');
      const mine = ++token;
      path = null;
      deviceBlob = file; deviceName = file.name;
      say(`Opening <b>${esc(file.name)}</b>…`);
      revoke();
      url = URL.createObjectURL(file);
      stage.innerHTML = `<div class="viewer-stage"><${kind} id="md-el" controls preload="metadata" ${loop ? 'loop' : ''}
        aria-label="${esc(file.name)}"></${kind}></div>`;
      const el = q('#md-el');
      el.onloadedmetadata = () => { if (mine === token) statusLine(); };
      el.onended = () => { if (mine === token && !loop) step(1); };
      el.onerror = () => {
        if (mine !== token) return;
        convertPrompt(file, file.name, kind, mine, file.name.toLowerCase().endsWith('.mkv') ? `
          <p class="muted" style="font-size:12.5px">Inside an MKV, H.264/AAC usually plays; HEVC, AV1 or DTS often does not.</p>` : '');
      };
      el.src = url;
      sync();
      say(`<b>${esc(file.name)}</b> from your Files (this computer) — it is not in the proton file system yet.
           <b>Save…</b> asks where to put it.`);
    }
    function askOpenVfs() {
      const list = playlist();
      say(`<div class="field" style="margin:0"><label for="md-ask"><b>Open a media file</b></label>
        <div class="fm-ask-row"><input id="md-ask" type="text" placeholder="${esc(HOME + '/Music/song.mp3')}" list="md-ask-list" autocomplete="off" spellcheck="false">
        <datalist id="md-ask-list">${list.map((p) => `<option value="${esc(p)}"></option>`).join('')}</datalist>
        <button class="btn sm primary" type="button" id="md-ask-ok">Open</button>
        <button class="btn sm" type="button" id="md-ask-browse">${iconSvg('folder')} Browse…</button>
        <button class="btn sm" type="button" id="md-ask-cancel">Cancel</button></div></div>`);
      const input = q('#md-ask');
      q('#md-ask-ok').onclick = () => {
        const typed = input.value.trim();
        if (!typed) { input.focus(); return; }
        load(typed);
      };
      q('#md-ask-browse').onclick = () => openApp('files', { path: path ? FS.dirname(path) : HOME });
      q('#md-ask-cancel').onclick = () => (path ? say(`Playing <b>${esc(path)}</b>.`) : startScreen());
      input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); q('#md-ask-ok').click(); } };
      input.focus();
    }

    q('#md-open').onclick = askOpen;
    q('#md-prev').onclick = () => step(-1);
    q('#md-next').onclick = () => step(1);
    q('#md-loop').onclick = () => {
      loop = !loop;
      const el = q('#md-el');
      if (el) el.loop = loop;
      sync();
    };
    q('#md-download').onclick = async () => {
      if (!path && !deviceBlob) return;
      const dest = await MH.askFileSource('save');
      if (!dest) return;
      try {
        const blob = deviceBlob || await FS.readBlob(path);
        const name = deviceName || FS.basename(path);
        if (dest === 'device') {
          MH.downloadBlob(name, blob);
          MH.toast(`Saved ${name} to your Files (this computer).`);
        } else {
          const dir = FS.join(HOME, 'Downloads');
          let target = FS.join(dir, name);
          if (FS.exists(target)) {
            const dot = name.lastIndexOf('.');
            const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
            for (let i = 2; i < 500; i++) {
              const n = `${base} (${i})${ext}`;
              if (!FS.exists(FS.join(dir, n))) { target = FS.join(dir, n); break; }
            }
          }
          await FS.writeBlob(target, blob);
          MH.toast(`Saved to the proton file system: ${target}`);
        }
      } catch (err) { MH.toast(err.message); }
    };
    q('#md-files').onclick = () => openApp('files', { path: path ? FS.dirname(path) : HOME, select: path || undefined });
    body.addEventListener('keydown', (e) => {
      if (!path || e.target.tagName === 'INPUT') return;
      const el = q('#md-el');
      if (e.key === 'ArrowRight' && e.shiftKey) { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft' && e.shiftKey) { e.preventDefault(); step(-1); }
      else if (e.key === ' ' && el) {
        e.preventDefault();
        /* Space plays/pauses; the browser implements both, so guard them. */
        try { el.paused ? el.play()?.catch?.(() => {}) : el.pause(); } catch { /* codec or context refuses */ }
      }
    });
    body.openPath = ({ path: p } = {}) => { if (p) load(p); };
    body.onDestroy = () => {
      token++;
      const el = q('#md-el');
      /* Stopping playback first is what the revoked URL would do anyway, but
       * pausing is immediate. Both are wrapped: a media element that never
       * loaded can refuse. */
      try { if (el && !el.paused) el.pause(); } catch { /* nothing was playing */ }
      el?.remove();
      revoke();
    };

    if (options.path) load(options.path);
    else startScreen();
  },
});
</script>
</body>
</html>
