<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Retro - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Web Retro</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: web-retro — a ROM launcher around the vendored webretro
 * emulator build in apps/tools/web-retro/webretro/ (see CREDITS.md).
 *
 * The launcher flow is adapted from Gams-Offline/Gams g/webretro.html: pick a
 * core, choose a ROM, then hand the file to webretro/launch.html over a
 * BroadcastChannel (?rom=channel) — the ROM never leaves the browser. The ROM
 * can come from EITHER file system: "From this computer" opens the device's
 * own file picker, "From proton Files" browses the account's virtual home
 * folder (whatever was imported with the Files app) and reads it with
 * FS.readBlob(). webretro itself is by BinBashBanana (GPL-3.0, via the
 * Gams-Offline/Gams copy). The front page has two tabs in the
 * desktop's own style: ROMs — four console boxes over the bundled
 * library in webretro/roms/ (the maintainer's own ROM files; see
 * CREDITS.md for the rights notes), each box bringing up that console's
 * games with their poster art — and Emulators, the same four console
 * boxes, where picking one asks whether the ROM comes from proton
 * Files or from this computer. Each bundled game loads into the
 * emulator through the same BroadcastChannel hand-off as a file you
 * pick yourself. */
'use strict';

/* ============================ WEB RETRO ============================ */
registerApp({
  /* Metadata (name, icon, cat, desc, w, h) lives in the app catalog:
   * data/applications.js — edit it there, not here. */
  render(body) {
    /* The four consoles, in the order their rows run down the front
     * page. Each maps to the webretro core that plays it; the GB row
     * covers GB, GBC and GBA, which all run on the one mgba core. */
    const CONSOLES = [
      ['NES', 'nestopia', 'NES'],
      ['SNES', 'snes9x', 'SNES'],
      ['N64', 'mupen64plus_next', 'N64'],
      ['GB', 'mgba', 'GB (GB · GBC · GBA)'],
    ];
    const romAccept = '.nes,.fds,.smc,.sfc,.gb,.gbc,.gba,.n64,.z64,.v64,.bin,.zip';
    const romExts = romAccept.split(',');
    /* The maintainer's own ROM library, bundled in webretro/roms/ (supplied
     * as .zip files, stored here extracted; box art from data/icons/).
     * Each entry is [ROM file, core, title, system, icon]. */
    const BUNDLED = [
      ['Mario Kart 64 (USA).z64', 'mupen64plus_next', 'Mario Kart 64', 'Nintendo 64', 'mario-kart-64'],
      ['Mario Party (USA).z64', 'mupen64plus_next', 'Mario Party', 'Nintendo 64', 'mario-party'],
      ['Paper Mario (USA).z64', 'mupen64plus_next', 'Paper Mario', 'Nintendo 64', 'paper-mario'],
      ['Doom 64 (USA) (Rev 1).z64', 'mupen64plus_next', 'Doom 64', 'Nintendo 64', 'doom-64'],
      ['Yoshi\'s Story (USA) (En,Ja).z64', 'mupen64plus_next', "Yoshi's Story", 'Nintendo 64', 'yoshis-story'],
      ['Super Mario 64 (USA).z64', 'mupen64plus_next', 'Super Mario 64', 'Nintendo 64', 'super-mario-64'],
      ['Banjo-Kazooie (USA) (Rev 1).z64', 'mupen64plus_next', 'Banjo-Kazooie', 'Nintendo 64', 'banjo-kazooie'],
      ['Super Smash Bros. (USA).z64', 'mupen64plus_next', 'Super Smash Bros.', 'Nintendo 64', 'super-smash-bros'],
      ['Excitebike (Japan, USA).nes', 'nestopia', 'Excitebike', 'NES', 'excitebike'],
      ['Super Mario Bros. + Duck Hunt (USA).nes', 'nestopia', 'Super Mario Bros. + Duck Hunt', 'NES', 'super-mario-bros-duck-hunt'],
      ['Super Mario Bros. 2 (USA) (Rev 1).nes', 'nestopia', 'Super Mario Bros. 2', 'NES', 'super-mario-bros-2'],
      ['Super Mario Bros. 3 (USA) (Rev 1).nes', 'nestopia', 'Super Mario Bros. 3', 'NES', 'super-mario-bros-3'],
      ['Tetris (USA) (Tengen) (Unl).nes', 'nestopia', 'Tetris', 'NES', 'tetris-nes'],
      ['Castlevania (USA) (Rev 1).nes', 'nestopia', 'Castlevania', 'NES', 'Castlevania'],
      ['Contra (USA).nes', 'nestopia', 'Contra', 'NES', 'Contra'],
      ['Mega Man 2 (USA).nes', 'nestopia', 'Mega Man 2', 'NES', 'mega-man-2'],
      ['Metroid (USA).nes', 'nestopia', 'Metroid', 'NES', 'metroid'],
      ['Super Mario World (U) [!].smc', 'snes9x', 'Super Mario World', 'SNES', 'super-mario-world'],
      ['Legend of Zelda, The - A Link to the Past (USA).sfc', 'snes9x', 'The Legend of Zelda: A Link to the Past', 'SNES', 'the-legend-of-zelda-a-link-to-the-past'],
      ['Donkey Kong Country (U) (V1.2) [!].smc', 'snes9x', 'Donkey Kong Country', 'SNES', 'donkey-kong-country'],
      ['Super Metroid (Japan, USA) (En,Ja).sfc', 'snes9x', 'Super Metroid', 'SNES', 'super-metroid'],
      ['Chrono Trigger (USA).sfc', 'snes9x', 'Chrono Trigger', 'SNES', 'chrono-trigger'],
      ['Doom (USA, Europe).gba', 'mgba', 'Doom', 'Game Boy Advance', 'doom-gba'],
      ['Grand Theft Auto Advance (USA).gba', 'mgba', 'Grand Theft Auto Advance', 'Game Boy Advance', 'grand-theft-auto-advance'],
      ['LEGO Star Wars - The Video Game (USA, Europe) (En,Fr,De,Es,It,Nl,Da).gba', 'mgba', 'LEGO Star Wars: The Video Game', 'Game Boy Advance', 'lego-star-wars-the-video-game'],
      ['Pokemon - Emerald Version (USA, Europe).gba', 'mgba', 'Pokémon Emerald', 'Game Boy Advance', 'pokemon-emerald'],
      ['Super Mario Advance (USA, Europe).gba', 'mgba', 'Super Mario Advance', 'Game Boy Advance', 'super-mario-advance'],
      ['Grand Theft Auto (USA) (GB Compatible).gbc', 'mgba', 'Grand Theft Auto', 'Game Boy Color', 'grand-theft-auto'],
      ['Grand Theft Auto 2 (USA).gbc', 'mgba', 'Grand Theft Auto 2', 'Game Boy Color', 'grand-theft-auto-2'],
      ['Pokemon - Red Version (USA, Europe) (SGB Enhanced).gb', 'mgba', 'Pokémon Red', 'Game Boy', 'pokemon-red'],
      ['Pokemon - Yellow Version - Special Pikachu Edition (USA, Europe) (GBC,SGB Enhanced).gb', 'mgba', 'Pokémon Yellow', 'Game Boy', 'pokemon-yellow'],
      ['Pokemon - Crystal Version (USA, Europe) (Rev 1).gbc', 'mgba', 'Pokémon Crystal', 'Game Boy Color', 'pokemon-crystal'],
      ['Space Invaders (USA) (SGB Enhanced).gb', 'mgba', 'Space Invaders', 'Game Boy', 'space-invaders'],
      ['Super Mario Bros. Deluxe (USA, Europe) (Rev 1).gbc', 'mgba', 'Super Mario Bros. Deluxe', 'Game Boy Color', 'super-mario-bros-deluxe'],
    ];
    let bc = null;
    let romSource = 'device';   // 'device' = real file picker, 'vfs' = proton Files
    let vfsPath = FS.home();    // folder shown in the proton Files browser
    let vfsPick = null;         // selected VFS path
    let selConsole = 'NES';     // console picked in the ROMs tab boxes
    let tab = 'roms';           // front-page tab: 'roms' | 'emulators'

    body.innerHTML = `${bar('Web Retro', '<button type="button" class="btn sm" id="wr-again" hidden>Change game</button>')}<div class="app-main pad" id="wr-main"></div>`;
    const main = body.querySelector('#wr-main');
    const again = body.querySelector('#wr-again');

    /* The emulator's own back arrow (its menu bar) cannot take the
     * frame anywhere useful — the page it linked to upstream is not
     * shipped, so it 404'd — so launch.html posts "webretro-back"
     * here instead, and we show the game chooser (the ROMs tab)
     * again, exactly like Change game. Only trust the message when it
     * comes from this window's own emulator frame. */
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'webretro-back') return;
      const frame = main.querySelector('#wr-frame');
      if (frame && event.source === frame.contentWindow) picker();
    });

    /* Same 10-letter channel name the Gams launcher generates. */
    function channelName() {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let out = '';
      for (let i = 0; i < 10; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    function isRom(name) {
      const lower = name.toLowerCase();
      return romExts.some((ext) => lower.endsWith(ext));
    }

    /* The proton Files browser: folders plus ROM files under the account's
     * home folder, one level at a time. */
    function renderVfs() {
      const list = main.querySelector('#wr-vfs-list');
      const crumb = main.querySelector('#wr-vfs-path');
      if (!list) return;
      crumb.textContent = vfsPath;
      let entries = [];
      try { entries = FS.list(vfsPath); } catch (err) { entries = []; }
      const rows = [];
      if (vfsPath !== FS.home()) {
        rows.push('<button type="button" class="btn sm" data-up="1">… Up</button>');
      }
      for (const e of entries) {
        if (e.type === 'dir') {
          rows.push(`<button type="button" class="btn sm" data-dir="${MH.esc(e.path)}">▸ ${MH.esc(e.name)}</button>`);
        } else if (isRom(e.name)) {
          const on = vfsPick === e.path ? ' primary' : '';
          rows.push(`<button type="button" class="btn sm${on}" data-file="${MH.esc(e.path)}">${MH.esc(e.name)}</button>`);
        }
      }
      list.innerHTML = rows.join('') || '<p class="muted" style="margin:0">No ROM files here — import some with the Files app.</p>';
    }

    function showSource(src) {
      romSource = src;
      main.querySelectorAll('[data-src]').forEach((b) => {
        b.classList.toggle('primary', b.dataset.src === src);
      });
      main.querySelector('#wr-device').hidden = src !== 'device';
      main.querySelector('#wr-vfs').hidden = src !== 'vfs';
      if (src === 'vfs') renderVfs();
    }

    /* A ROM picked in the proton Files browser launches straight
     * into the emulator — there is no separate start button. */
    async function playVfsRom() {
      const core = main.querySelector('#wr-upload').dataset.core;
      try {
        const blob = await FS.readBlob(vfsPick);
        play(core, new File([blob], FS.basename(vfsPick)));
      } catch (err) {
        MH.toast(err.message || 'Could not read that ROM.');
      }
    }

    /* Which console row a core (and so every bundled game on it)
     * belongs to. */
    function catOf(core) {
      const hit = CONSOLES.find(([, c]) => c === core);
      return hit ? hit[0] : null;
    }

    /* The ROMs tab's grid: the picked console's bundled games. */
    function renderGrid() {
      const grid = main.querySelector('#wr-grid');
      const title = main.querySelector('#wr-gridtitle');
      if (!grid || !title) return;
      const label = CONSOLES.find(([cat]) => cat === selConsole)[2];
      const items = BUNDLED.map((g, i) => [g, i]).filter(([g]) => catOf(g[1]) === selConsole);
      title.textContent = `${label} games`;
      grid.innerHTML = items.length
        ? items.map(([g, i]) => `<button type="button" class="btn wr-game" data-bundled="${i}"><img src="data/icons/${g[4]}.jpeg" alt=""><span>${MH.esc(g[2])}</span></button>`).join('')
        : `<p class="muted" style="margin:0">No ${MH.esc(label)} games are bundled yet — play your own from the Emulators tab.</p>`;
    }

    /* The Emulators tab swaps between its console boxes and the
     * "where from?" screen for the picked emulator. */
    function showEmuHome() {
      main.querySelector('#wr-emu-home').hidden = false;
      main.querySelector('#wr-upload').hidden = true;
    }

    function showUpload(core) {
      main.querySelector('#wr-corename').textContent =
        CONSOLES.find(([, c]) => c === core)[2];
      main.querySelector('#wr-upload').dataset.core = core;
      main.querySelector('#wr-emu-home').hidden = true;
      main.querySelector('#wr-upload').hidden = false;
      showSource(romSource);
    }

    /* The two front-page tabs: ROMs (bundled games) and Emulators
     * (your own ROMs). The picked tab shows its section, in the
     * desktop's own style. */
    function showTab(next) {
      tab = next;
      main.querySelectorAll('[data-wr-tab]').forEach((b) => {
        const on = b.dataset.wrTab === tab;
        b.classList.toggle('primary', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      main.querySelector('#wr-roms').hidden = tab !== 'roms';
      main.querySelector('#wr-emulators').hidden = tab !== 'emulators';
      if (tab === 'emulators') showEmuHome();
    }

    function picker() {
      if (bc) { bc.close(); bc = null; }
      again.hidden = true;
      vfsPick = null;
      romSource = 'device';
      tab = 'roms';
      main.className = 'app-main pad';
      const countFor = (cat) => BUNDLED.filter((g) => catOf(g[1]) === cat).length;
      main.innerHTML = `<style>
        /* Black page, white text. Any option glows deep dark blue while
         * hovered and sits dark gray with white text once picked. Text
         * is never selectable, so no caret or text cursor shows over
         * titles, labels or descriptions. */
        #wr-main{background:#000;color:#fff}
        #wr-main,#wr-main *{user-select:none;-webkit-user-select:none;cursor:default}
        #wr-main button,#wr-main input[type=file]{cursor:pointer}
        #wr-main .btn{background:#0d0d0d;border-color:#3d3d3d;color:#fff}
        #wr-main .btn.primary{background:#3d3d3d;border-color:#5c5c5c;color:#fff}
        #wr-main .btn:hover{background:#0b2e63;border-color:#1d4e9e;color:#fff}
        #wr-main .muted{color:#d9d9d9}
        .wr-tabs{display:flex;gap:8px;margin-bottom:14px}
        .wr-tab{flex:1;padding:10px 16px;font-size:15px}
        .wr-consoles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px;width:100%}
        .wr-console{display:flex;flex-direction:column;align-items:flex-start;gap:3px;height:auto;padding:14px 16px;text-align:left;min-width:0;width:100%}
        .wr-console b{font-size:19px;line-height:1.2}
        .wr-console span{font-size:12px;opacity:.75}
        .wr-sys{margin:2px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
        .wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
        .wr-game{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 7px;height:auto}
        .wr-game img{width:76px;height:76px;object-fit:cover;border-radius:6px;background:#000}
        .wr-game span{font-size:11.5px;line-height:1.25;text-align:center}
        .wr-topbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
        .wr-topbar .wr-back{font-size:28px;line-height:1;padding:10px 18px;min-width:56px;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
        .wr-note{margin:16px 0 0}
      </style>
      <div class="wr-tabs" role="tablist" aria-label="Web Retro">
        <button type="button" class="btn wr-tab primary" data-wr-tab="roms" role="tab" aria-selected="true">ROMs</button>
        <button type="button" class="btn wr-tab" data-wr-tab="emulators" role="tab" aria-selected="false">Emulators</button>
      </div>
      <section id="wr-roms">
        <p class="muted" style="margin-top:0">Pick a console box to bring up its bundled games, then pick a game to play it.</p>
        <div class="wr-consoles">
          ${CONSOLES.map(([cat, , label]) => `<button type="button" class="btn wr-console${cat === selConsole ? ' primary' : ''}" data-console="${cat}"><b>${cat}</b><span>${countFor(cat)} bundled games · ${MH.esc(label)}</span></button>`).join('')}
        </div>
        <h4 class="wr-sys" id="wr-gridtitle"></h4>
        <div class="wr-grid" id="wr-grid"></div>
        <p class="muted wr-note">Saves and save states live in your browser's own
          storage (webretro keeps them in IndexedDB). The bundled games are the
          maintainer's own ROM files (see <b>CREDITS.md</b>).</p>
      </section>
      <section id="wr-emulators" hidden>
        <div id="wr-emu-home">
          <div class="wr-consoles">
            ${CONSOLES.map(([cat, core, label]) => `<button type="button" class="btn wr-console" data-core="${core}"><b>${cat}</b><span>${MH.esc(label)} · ${core}</span></button>`).join('')}
          </div>
          <p class="muted" style="margin:8px 0 0">Plays .z64 / .n64, .smc / .sfc,
            .nes and .gb / .gbc / .gba files (zips too). Your ROM goes
            straight into the emulator and never leaves your browser.</p>
        </div>
        <div id="wr-upload" class="wr-upload" hidden>
          <div class="wr-topbar">
            <button type="button" class="btn sm wr-back" id="wr-back" aria-label="Back to the emulators">←</button>
            <strong>Emulator — <span id="wr-corename"></span></strong>
          </div>
          <div class="field">
            <label>Where is the ROM?</label>
            <div style="display:flex;gap:8px;margin:0 0 10px">
              <button type="button" class="btn sm" data-src="vfs">From proton Files</button>
              <button type="button" class="btn sm primary" data-src="device">From your Files</button>
            </div>
            <div id="wr-device">
              <input type="file" id="wr-rom" accept="${romAccept}">
            </div>
            <div id="wr-vfs" hidden>
              <p class="muted" style="margin:0 0 6px">ROM files in your proton Files home folder
              (import more with the <b>Files</b> app) — <span id="wr-vfs-path"></span></p>
              <div id="wr-vfs-list" style="max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px"></div>
            </div>
          </div>
        </div>
      </section>`;
      renderGrid();
      main.querySelectorAll('[data-wr-tab]').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.wrTab)));
      main.querySelectorAll('[data-console]').forEach((b) => b.addEventListener('click', () => {
        selConsole = b.dataset.console;
        main.querySelectorAll('[data-console]').forEach((x) => x.classList.toggle('primary', x === b));
        renderGrid();
      }));
      main.querySelector('#wr-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bundled]');
        if (btn) playBundled(BUNDLED[Number(btn.dataset.bundled)]);
      });
      main.querySelectorAll('[data-core]').forEach((b) => b.addEventListener('click', () => {
        main.querySelectorAll('[data-core]').forEach((x) => x.classList.toggle('primary', x === b));
        showUpload(b.dataset.core);
      }));
      main.querySelector('#wr-rom').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) play(main.querySelector('#wr-upload').dataset.core, file);
      });
      main.querySelector('#wr-back').addEventListener('click', showEmuHome);
      main.querySelectorAll('[data-src]').forEach((b) => b.addEventListener('click', () => showSource(b.dataset.src)));
      main.querySelector('#wr-vfs-list').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.up) {
          vfsPath = FS.dirname(vfsPath);
          if (vfsPath === '/home' || !vfsPath.startsWith(FS.home())) vfsPath = FS.home();
          vfsPick = null;
          renderVfs();
        } else if (btn.dataset.dir) {
          vfsPath = btn.dataset.dir;
          vfsPick = null;
          renderVfs();
        } else if (btn.dataset.file) {
          vfsPick = btn.dataset.file;
          playVfsRom();
        }
      });
    }

    /* A bundled game: fetch its ROM file from webretro/roms/ and hand it
     * to the emulator exactly like a file picked from this computer. */
    async function playBundled([file, core, title]) {
      try {
        const res = await fetch(`apps/tools/web-retro/webretro/roms/${encodeURIComponent(file)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        play(core, new File([blob], file));
      } catch (err) {
        MH.toast(`Could not load ${title}.`);
      }
    }

    function play(core, file) {
      const name = file.name.split('.')[0] || 'GAME';
      const channel = channelName();
      bc = new BroadcastChannel(channel);
      again.hidden = false;
      main.className = 'app-main';
      main.innerHTML = `<iframe title="Web Retro" id="wr-frame" allow="autoplay; fullscreen; pointer-lock; gamepad" style="width:100%;height:100%;min-height:360px;border:0;display:block"></iframe>`;
      bc.onmessage = (event) => {
        if (event.data && event.data.status === 'ready') bc.postMessage({ rom: file });
      };
      main.querySelector('#wr-frame').src =
        `apps/tools/web-retro/webretro/launch.html?core=${encodeURIComponent(core)}&rom=channel&name=${encodeURIComponent(name)}&channel=${encodeURIComponent(channel)}`;
    }

    again.addEventListener('click', picker);
    picker();
  },
});
</script>
</body>
</html>
