<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Retro - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Web Retro</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: web-retro — a ROM launcher around the vendored webretro
 * emulator build in apps/tools/web-retro/webretro/ (see CREDITS.md).
 *
 * The launcher flow is adapted from Gams-Offline/Gams g/webretro.html: pick a
 * core, choose a ROM, then hand the file to webretro/launch.html over a
 * BroadcastChannel (?rom=channel) — the ROM never leaves the browser. The ROM
 * can come from EITHER file system: "From this computer" opens the device's
 * own file picker, "From proton Files" browses the account's virtual home
 * folder (whatever was imported with the Files app) and reads it with
 * FS.readBlob(). webretro itself is by BinBashBanana (GPL-3.0, via the
 * Gams-Offline/Gams copy). The front page is two panels: ROMs (the
 * bundled library in webretro/roms/ — the maintainer's own ROM files,
 * see CREDITS.md for the rights notes — grouped by system) and Emulators
 * (pick a core, then feed it a ROM of your own). Each bundled game loads
 * into the emulator through the same BroadcastChannel hand-off as a file
 * you pick yourself. */
'use strict';

/* ============================ WEB RETRO ============================ */
registerApp({
  /* Metadata (name, icon, cat, desc, w, h) lives in the app catalog:
   * data/applications.js — edit it there, not here. */
  render(body) {
    const CORES = [
      ['mupen64plus_next', 'Nintendo 64'],
      ['snes9x', 'SNES'],
      ['nestopia', 'NES'],
      ['mgba', 'Game Boy (GB/GBC/GBA)'],
    ];
    const romAccept = '.nes,.fds,.smc,.sfc,.gb,.gbc,.gba,.n64,.z64,.v64,.bin,.zip';
    const romExts = romAccept.split(',');
    /* The maintainer's own ROM library, bundled in webretro/roms/ (supplied
     * as .zip files, stored here extracted; box art from data/icons/).
     * Each entry is [ROM file, core, title, system, icon]. */
    const BUNDLED = [
      ['Mario Kart 64 (USA).z64', 'mupen64plus_next', 'Mario Kart 64', 'Nintendo 64', 'mario-kart-64'],
      ['Mario Party (USA).z64', 'mupen64plus_next', 'Mario Party', 'Nintendo 64', 'mario-party'],
      ['Paper Mario (USA).z64', 'mupen64plus_next', 'Paper Mario', 'Nintendo 64', 'paper-mario'],
      ['Doom 64 (USA) (Rev 1).z64', 'mupen64plus_next', 'Doom 64', 'Nintendo 64', 'doom-64'],
      ['Yoshi\'s Story (USA) (En,Ja).z64', 'mupen64plus_next', "Yoshi's Story", 'Nintendo 64', 'yoshis-story'],
      ['Excitebike (Japan, USA).nes', 'nestopia', 'Excitebike', 'NES', 'excitebike'],
      ['Super Mario Bros. + Duck Hunt (USA).nes', 'nestopia', 'Super Mario Bros. + Duck Hunt', 'NES', 'super-mario-bros-duck-hunt'],
      ['Super Mario Bros. 2 (USA) (Rev 1).nes', 'nestopia', 'Super Mario Bros. 2', 'NES', 'super-mario-bros-2'],
      ['Super Mario Bros. 3 (USA) (Rev 1).nes', 'nestopia', 'Super Mario Bros. 3', 'NES', 'super-mario-bros-3'],
      ['Tetris (USA) (Tengen) (Unl).nes', 'nestopia', 'Tetris', 'NES', 'tetris-nes'],
      ['Doom (USA, Europe).gba', 'mgba', 'Doom', 'Game Boy Advance', 'doom-gba'],
      ['Grand Theft Auto Advance (USA).gba', 'mgba', 'Grand Theft Auto Advance', 'Game Boy Advance', 'grand-theft-auto-advance'],
      ['LEGO Star Wars - The Video Game (USA, Europe) (En,Fr,De,Es,It,Nl,Da).gba', 'mgba', 'LEGO Star Wars: The Video Game', 'Game Boy Advance', 'lego-star-wars-the-video-game'],
      ['Pokemon - Emerald Version (USA, Europe).gba', 'mgba', 'Pokémon Emerald', 'Game Boy Advance', 'pokemon-emerald'],
      ['Sims, The - Bustin\' Out (USA) (En,Fr,De,Es,It,Nl) (Rev 1).gba', 'mgba', "The Sims Bustin' Out", 'Game Boy Advance', 'the-sims-bustin-out'],
      ['Super Mario Advance (USA, Europe).gba', 'mgba', 'Super Mario Advance', 'Game Boy Advance', 'super-mario-advance'],
      ['Grand Theft Auto (USA) (GB Compatible).gbc', 'mgba', 'Grand Theft Auto', 'Game Boy Color', 'grand-theft-auto'],
      ['Grand Theft Auto 2 (USA).gbc', 'mgba', 'Grand Theft Auto 2', 'Game Boy Color', 'grand-theft-auto-2'],
      ['Pokemon - Red Version (USA, Europe) (SGB Enhanced).gb', 'mgba', 'Pokémon Red', 'Game Boy', 'pokemon-red'],
      ['Pokemon - Yellow Version - Special Pikachu Edition (USA, Europe) (GBC,SGB Enhanced).gb', 'mgba', 'Pokémon Yellow', 'Game Boy', 'pokemon-yellow'],
      ['Pokemon - Crystal Version (USA, Europe) (Rev 1).gbc', 'mgba', 'Pokémon Crystal', 'Game Boy Color', 'pokemon-crystal'],
      ['Space Invaders (USA) (SGB Enhanced).gb', 'mgba', 'Space Invaders', 'Game Boy', 'space-invaders'],
      ['Super Mario Bros. Deluxe (USA, Europe) (Rev 1).gbc', 'mgba', 'Super Mario Bros. Deluxe', 'Game Boy Color', 'super-mario-bros-deluxe'],
    ];
    let bc = null;
    let romSource = 'device';   // 'device' = real file picker, 'vfs' = proton Files
    let vfsPath = FS.home();    // folder shown in the proton Files browser
    let vfsPick = null;         // selected VFS path

    body.innerHTML = `${bar('Web Retro', '<button type="button" class="btn sm" id="wr-again" hidden>Change game</button>')}<div class="app-main pad" id="wr-main"></div>`;
    const main = body.querySelector('#wr-main');
    const again = body.querySelector('#wr-again');

    /* Same 10-letter channel name the Gams launcher generates. */
    function channelName() {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let out = '';
      for (let i = 0; i < 10; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    function isRom(name) {
      const lower = name.toLowerCase();
      return romExts.some((ext) => lower.endsWith(ext));
    }

    /* The proton Files browser: folders plus ROM files under the account's
     * home folder, one level at a time. */
    function renderVfs() {
      const list = main.querySelector('#wr-vfs-list');
      const crumb = main.querySelector('#wr-vfs-path');
      if (!list) return;
      crumb.textContent = vfsPath;
      let entries = [];
      try { entries = FS.list(vfsPath); } catch (err) { entries = []; }
      const rows = [];
      if (vfsPath !== FS.home()) {
        rows.push('<button type="button" class="btn sm" data-up="1">… Up</button>');
      }
      for (const e of entries) {
        if (e.type === 'dir') {
          rows.push(`<button type="button" class="btn sm" data-dir="${MH.esc(e.path)}">▸ ${MH.esc(e.name)}</button>`);
        } else if (isRom(e.name)) {
          const on = vfsPick === e.path ? ' primary' : '';
          rows.push(`<button type="button" class="btn sm${on}" data-file="${MH.esc(e.path)}">${MH.esc(e.name)}</button>`);
        }
      }
      list.innerHTML = rows.join('') || '<p class="muted" style="margin:0">No ROM files here — import some with the Files app.</p>';
    }

    function showSource(src) {
      romSource = src;
      main.querySelectorAll('[data-src]').forEach((b) => {
        b.classList.toggle('primary', b.dataset.src === src);
      });
      main.querySelector('#wr-device').hidden = src !== 'device';
      main.querySelector('#wr-vfs').hidden = src !== 'vfs';
      if (src === 'vfs') renderVfs();
    }

    function picker() {
      if (bc) { bc.close(); bc = null; }
      again.hidden = true;
      vfsPick = null;
      romSource = 'device';
      main.className = 'app-main pad';
      /* The ROMs panel, grouped by system, in library order. */
      const groups = [];
      for (let i = 0; i < BUNDLED.length; i++) {
        let g = groups.find((x) => x.sys === BUNDLED[i][3]);
        if (!g) { g = { sys: BUNDLED[i][3], items: [] }; groups.push(g); }
        g.items.push(i);
      }
      const romsHtml = groups.map((g) => `
        <h4 class="wr-sys">${MH.esc(g.sys)}</h4>
        <div class="wr-grid">${g.items.map((i) => `<button type="button" class="btn wr-game" data-bundled="${i}"><img src="data/icons/${BUNDLED[i][4]}.jpeg" alt=""><span>${MH.esc(BUNDLED[i][2])}</span></button>`).join('')}</div>`).join('');
      main.innerHTML = `<style>
        .wr-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
        @media (max-width:820px){.wr-cols{grid-template-columns:1fr}}
        .wr-panel h3{margin-top:0}
        .wr-sys{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
        .wr-sys:first-of-type{margin-top:4px}
        .wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
        .wr-game{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px;height:auto}
        .wr-game img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:#000}
        .wr-game span{font-size:11.5px;line-height:1.25;text-align:center}
        .wr-foot{margin:10px 2px 0}
      </style>
      <div class="wr-cols">
        <section class="card wr-panel">
          <h3>🎮 ROMs</h3>
          <p class="muted">Your bundled library — ${BUNDLED.length} games. Click one
          and it starts right away on its matching emulator.</p>
          ${romsHtml}
        </section>
        <section class="card wr-panel">
          <h3>🕹️ Emulators</h3>
          <p class="muted">Bring your own ROMs. Pick an emulator, then choose a
          ROM file — from this computer or from your proton Files. It goes
          straight into the emulator and never leaves your browser.</p>
          <div class="field"><label>Emulator</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              ${CORES.map(([id, label]) => `<button type="button" class="btn" data-core="${id}">${label}</button>`).join('')}
            </div>
            <p class="muted" style="margin:8px 0 0">Plays .z64 / .n64, .smc / .sfc,
            .nes and .gb / .gbc / .gba files (zips too).</p>
          </div>
          <div class="field" id="wr-upload" hidden>
            <label for="wr-rom">ROM — <span id="wr-corename"></span></label>
            <div style="display:flex;gap:8px;margin:0 0 10px">
              <button type="button" class="btn sm primary" data-src="device">From this computer</button>
              <button type="button" class="btn sm" data-src="vfs">From proton Files</button>
            </div>
            <div id="wr-device">
              <input type="file" id="wr-rom" accept="${romAccept}">
            </div>
            <div id="wr-vfs" hidden>
              <p class="muted" style="margin:0 0 6px">ROM files in your proton home folder
              (import more with the <b>Files</b> app) — <span id="wr-vfs-path"></span></p>
              <div id="wr-vfs-list" style="max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px"></div>
            </div>
            <button type="button" class="btn primary" id="wr-play" style="margin-top:10px">Play ROM</button>
          </div>
        </section>
      </div>
      <p class="muted wr-foot">Saves and save states live in your browser's own
      storage (webretro keeps them in IndexedDB). The bundled games are the
      maintainer's own ROM files (see <b>CREDITS.md</b>).</p>`;
      main.querySelectorAll('[data-bundled]').forEach((b) => b.addEventListener('click', () => {
        playBundled(BUNDLED[Number(b.dataset.bundled)]);
      }));
      main.querySelectorAll('[data-core]').forEach((b) => b.addEventListener('click', () => {
        main.querySelectorAll('[data-core]').forEach((x) => x.classList.toggle('primary', x === b));
        main.querySelector('#wr-corename').textContent = b.textContent;
        main.querySelector('#wr-upload').dataset.core = b.dataset.core;
        main.querySelector('#wr-upload').hidden = false;
        showSource(romSource);
      }));
      main.querySelectorAll('[data-src]').forEach((b) => b.addEventListener('click', () => showSource(b.dataset.src)));
      main.querySelector('#wr-vfs-list').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.up) {
          vfsPath = FS.dirname(vfsPath);
          if (vfsPath === '/home' || !vfsPath.startsWith(FS.home())) vfsPath = FS.home();
          vfsPick = null;
          renderVfs();
        } else if (btn.dataset.dir) {
          vfsPath = btn.dataset.dir;
          vfsPick = null;
          renderVfs();
        } else if (btn.dataset.file) {
          vfsPick = btn.dataset.file;
          renderVfs();
        }
      });
      main.querySelector('#wr-play').addEventListener('click', async () => {
        const upload = main.querySelector('#wr-upload');
        const core = upload.dataset.core;
        if (romSource === 'device') {
          const file = main.querySelector('#wr-rom').files[0];
          if (!file) { MH.toast('Choose a ROM file first.'); return; }
          play(core, file);
          return;
        }
        if (!vfsPick) { MH.toast('Choose a ROM file first.'); return; }
        try {
          const blob = await FS.readBlob(vfsPick);
          play(core, new File([blob], FS.basename(vfsPick)));
        } catch (err) {
          MH.toast(err.message || 'Could not read that ROM.');
        }
      });
    }

    /* A bundled game: fetch its ROM file from webretro/roms/ and hand it
     * to the emulator exactly like a file picked from this computer. */
    async function playBundled([file, core, title]) {
      try {
        const res = await fetch(`apps/tools/web-retro/webretro/roms/${encodeURIComponent(file)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        play(core, new File([blob], file));
      } catch (err) {
        MH.toast(`Could not load ${title}.`);
      }
    }

    function play(core, file) {
      const name = file.name.split('.')[0] || 'GAME';
      const channel = channelName();
      bc = new BroadcastChannel(channel);
      again.hidden = false;
      main.className = 'app-main';
      main.innerHTML = `<iframe title="Web Retro" id="wr-frame" allow="autoplay; fullscreen; pointer-lock; gamepad" style="width:100%;height:100%;min-height:360px;border:0;display:block"></iframe>`;
      bc.onmessage = (event) => {
        if (event.data && event.data.status === 'ready') bc.postMessage({ rom: file });
      };
      main.querySelector('#wr-frame').src =
        `apps/tools/web-retro/webretro/launch.html?core=${encodeURIComponent(core)}&rom=channel&name=${encodeURIComponent(name)}&channel=${encodeURIComponent(channel)}`;
    }

    again.addEventListener('click', picker);
    picker();
  },
});
</script>
</body>
</html>
