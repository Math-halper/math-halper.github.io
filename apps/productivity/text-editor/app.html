<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Editor - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Text Editor</b>
from the proton menu. The script below is fetched and run by proton's HTML
loader (assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: text-editor — the plain-text editor for the virtual file
 * system. Loaded by index.html; calls registerApp() (see apps/README.md).
 *
 * FS.appFor() sends every non-binary file without a more specific viewer here
 * (.txt, .md, .js, .css, .json, …), and openFSItem() in assets/core.js opens
 * this window with { path }. Files under /home/<you> are editable and saved
 * with FS.write(); proton's own tree (/apps, /assets, /data, …) cannot be
 * rewritten by a static website, so those files open as editable drafts:
 * the text can be changed freely, and "Save a copy…" writes the draft into
 * your home folder while the original stays untouched. A file opened from
 * the device is likewise an editable draft until it is saved somewhere.
 *
 * Prompts are inline forms in the note bar, never window.prompt(): they keep
 * the text you are editing on screen while you type a path.
 */
'use strict';

registerApp({
  render(body, options) {
    const HOME = FS.home();
    let path = null;       // absolute VFS path of the open file, or null
    let deviceName = '';   // name of a file opened from the device ("your Files")
    let dirty = false;
    let loading = 0;       // newest load wins (openPath can be called again)
    let noteHtml = '';     // the note to restore when a prompt is cancelled
    const esc = MH.esc;
    const q = (s) => body.querySelector(s);

    const isText = (p) => {
      const st = FS.stat(p);
      return !!st && st.type === 'file' && !FS.isBinary(p);
    };
    /* Your own text files, for the Open datalist and the start screen. The
     * system tree is left out of the list: hundreds of read-only code files. */
    function myTextFiles() {
      try {
        return FS.find('', HOME).filter((e) => e.type === 'file' && isText(e.path)).map((e) => e.path).sort();
      } catch { return []; }
    }
    /* A few interesting read-only system files, so Open is not only about
     * your own folder. */
    const systemTextFiles = () => ['/README.md', '/CREDITS.md', '/data/applications.js', '/apps/README.md']
      .filter((p) => FS.stat(p)?.type === 'file');
    function uniqueName(dir, name) {
      if (!FS.exists(FS.join(dir, name))) return name;
      const dot = name.lastIndexOf('.');
      const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
      for (let i = 2; i < 500; i++) if (!FS.exists(FS.join(dir, `${base} (${i})${ext}`))) return `${base} (${i})${ext}`;
      return `${base} (${Date.now()})${ext}`;
    }

    /* ------------------------------- chrome ----------------------------- */
    body.innerHTML = `${bar('Text Editor', `<button class="btn sm" type="button" id="te-open">${iconSvg('folder-open')} Open…</button>
        <button class="btn sm" type="button" id="te-new">${iconSvg('plus')} New</button>
        <button class="btn sm primary" type="button" id="te-save" disabled>${iconSvg('save')} Save…</button>
        <button class="btn sm" type="button" id="te-copy" disabled>${iconSvg('copy')} Save a copy…</button>
        <button class="btn sm" type="button" id="te-files" disabled>${iconSvg('folder')} Show in Files</button>`)}
      <div class="viewer-note" id="te-note" hidden></div>
      <div class="app-main editor" id="te-main"></div>
      <div class="fm-status" id="te-status"></div>`;

    const main = q('#te-main'), note = q('#te-note'), status = q('#te-status');

    /* The note bar doubles as the prompt host, so asking for a path never
     * throws away the text on screen. */
    function say(html) {
      noteHtml = html || '';
      note.hidden = !noteHtml;
      note.innerHTML = noteHtml;
      const action = note.querySelector('[data-act]');
      if (action) action.onclick = () => saveCopy();
    }
    function updateStatus() {
      const st = path ? FS.stat(path) : null;
      const text = q('#te-text')?.value ?? '';
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const size = MH.fmtBytes(new Blob([text]).size);
      status.innerHTML = st
        ? `<span>${esc(st.path)}</span><span>${st.user ? 'Your account' : 'Read-only system original · editable draft'}</span><span>${size}</span>
           <span style="margin-left:auto">${words} words · ${text.length} characters${dirty ? ' · <b>unsaved changes</b>' : ''}</span>`
        : deviceName
          ? `<span>${esc(deviceName)}</span><span>Your Files (this computer) · editable draft</span><span>${size}</span>
           <span style="margin-left:auto">${words} words · ${text.length} characters${dirty ? ' · <b>unsaved changes</b>' : ''}</span>`
        : `<span>No file open</span><span style="margin-left:auto">${words} words · ${text.length} characters${dirty ? ' · <b>unsaved changes</b>' : ''}</span>`;
    }
    function syncButtons() {
      const st = path ? FS.stat(path) : null;
      q('#te-save').disabled = !((path && FS.isWritable(path)) || deviceName);
      q('#te-copy').disabled = !st && !deviceName;
      q('#te-files').disabled = !st;
    }
    function startScreen() {
      path = null; dirty = false;
      syncButtons();
      const files = myTextFiles().slice(0, 40);
      say(`<b>Text Editor</b> — open a file below, or use <b>Open…</b> / <b>New</b> above. Anything in
           <b>Files</b> that is plain text opens here; proton's own system files open as editable
           drafts, with <b>Save a copy…</b> for the changed copy.`);
      main.innerHTML = `<div class="pad" style="overflow:auto;height:100%">
        <h2 style="margin:0 0 4px">${iconSvg('file-text')} Nothing open yet</h2>
        <p class="muted" style="margin-top:0">Everything you save lives in this browser, under your account, inside
        <span class="kbd">${esc(HOME)}</span>. Export a backup any time from <b>Settings → Backup</b>.</p>
        <div class="fm-ask-row" style="margin:12px 0">
          <button class="btn primary" type="button" id="te-start-open">${iconSvg('folder-open')} Open a file…</button>
          <button class="btn" type="button" id="te-start-new">${iconSvg('plus')} New file</button>
          <button class="btn" type="button" id="te-start-files">${iconSvg('folder')} Browse in Files</button>
        </div>
        <h3>Your text files</h3>
        ${files.length
          ? `<div class="listrows viewer-list">${files.map((p) => `<button type="button" class="rowitem" data-open="${esc(p)}">${iconSvg('file-text')}<span class="fm-name">${esc(FS.basename(p))}</span><span class="fm-meta">${MH.fmtBytes(FS.stat(p)?.size || 0)}</span></button>`).join('')}</div>`
          : '<p class="muted">No text files in your home folder yet — <b>New</b> creates one.</p>'}
      </div>`;
      main.querySelector('#te-start-open').onclick = askOpen;
      main.querySelector('#te-start-new').onclick = askNew;
      main.querySelector('#te-start-files').onclick = () => openApp('files', { path: HOME });
      main.querySelectorAll('[data-open]').forEach((b) => { b.onclick = () => load(b.dataset.open); });
      updateStatus();
    }
    function editorScreen(text = '') {
      /* Every document on screen is editable: your own files save in place,
       * while a read-only system file (or one opened from the device) is an
       * editable draft whose changes leave through Save/Save a copy. The
       * textarea is therefore never readonly — a caret that cannot delete
       * or type is a bug, not a lock. */
      main.innerHTML = `<textarea id="te-text" spellcheck="false" aria-label="File contents"></textarea>`;
      const area = q('#te-text');
      area.value = text;
      area.oninput = () => { dirty = true; updateStatus(); };
      /* Tab types spaces instead of moving focus out of the editor. */
      area.onkeydown = (e) => {
        if (e.key !== 'Tab') return;
        e.preventDefault();
        const { selectionStart: s, selectionEnd: t } = area;
        area.value = area.value.slice(0, s) + '  ' + area.value.slice(t);
        area.setSelectionRange(s + 2, s + 2);
        dirty = true;
        updateStatus();
      };
      syncButtons();
      updateStatus();
      return area;
    }
    /* The prompt replaces the note bar; closeForm() puts the old note back. */
    let closeForm = () => {};
    function askForm({ title, value = '', placeholder = '', help = '', ok = 'OK', list = null, onSubmit }) {
      const restore = noteHtml;
      closeForm = () => say(restore);
      say(`<div class="field" style="margin:0 0 7px"><label for="te-ask-input"><b>${esc(title)}</b></label>
        <div class="fm-ask-row"><input id="te-ask-input" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}"
          ${list ? 'list="te-ask-list"' : ''} autocomplete="off" spellcheck="false">
          <button class="btn sm primary" type="button" id="te-ask-ok">${esc(ok)}</button>
          <button class="btn sm" type="button" id="te-ask-cancel">Cancel</button></div>
        ${list ? `<datalist id="te-ask-list">${list.map((p) => `<option value="${esc(p)}"></option>`).join('')}</datalist>` : ''}</div>
        ${help ? `<p class="fm-ask-note" style="margin:0">${help}</p>` : ''}`);
      const input = q('#te-ask-input');
      const cancel = () => closeForm();
      const submit = () => {
        const typed = input.value.trim();
        if (!typed) { input.focus(); return; }
        try { Promise.resolve(onSubmit(typed)).catch((err) => { MH.toast(err.message); closeForm(); }); }
        catch (err) { MH.toast(err.message); closeForm(); }
      };
      q('#te-ask-ok').onclick = submit;
      q('#te-ask-cancel').onclick = cancel;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      };
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    function askOpen() {
      MH.askFileSource('open').then((src) => {
        if (src === 'device') openDevice();
        else if (src === 'vfs') askOpenVfs();
      });
    }
    function askOpenVfs() {
      askForm({
        title: 'Open a text file', value: path || '', ok: 'Open',
        placeholder: FS.join(HOME, 'Documents', 'notes.txt'),
        list: [...myTextFiles(), ...systemTextFiles()],
        help: 'Type a path or pick a file. Folders open in Files; proton system files open as editable drafts.',
        onSubmit: (raw) => {
          const p = FS.normalize(raw), st = FS.stat(p);
          if (!st) throw new Error(`No such file: ${p}`);
          if (st.type === 'dir') { closeForm(); openApp('files', { path: p }); return; }
          if (FS.isBinary(p)) throw new Error('That file is binary — open it from Files with its own app.');
          load(p);
        },
      });
    }
    function readAsText(file) {
      if (typeof file.text === 'function') return file.text();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result ?? ''));
        reader.onerror = () => reject(new Error(`Could not read ${file.name || 'that file'}.`));
        reader.readAsText(file);
      });
    }
    async function openDevice() {
      const file = await MH.devicePick('.txt,.md,.markdown,.js,.mjs,.cjs,.json,.css,.csv,.tsv,.xml,.yml,.yaml,.ini,.log,.svg,.html,.htm,.text,.conf,.sh,.py');
      if (!file) return;
      if (dirty && path && !confirmBox(`Discard the unsaved changes in ${FS.basename(path)}?`)) return;
      if (dirty && !path && !confirmBox('Discard the unsaved changes?')) return;
      const token = ++loading;
      try {
        const text = await readAsText(file);
        if (token !== loading) return;
        path = null;
        deviceName = file.name;
        dirty = false;
        syncButtons();
        editorScreen(text);
        say(`Opened <b>${esc(file.name)}</b> from your Files (this computer) — it is not in the proton file system yet. <b>Save…</b> asks where to put it.`);
        updateStatus();
      } catch (err) { MH.toast(err.message); }
    }
    function askNew() {
      askForm({
        title: 'New text file', value: FS.join(HOME, 'Documents', 'untitled.txt'), ok: 'Create',
        list: [HOME, ...userData.dirs.slice().sort()],
        help: `Created inside your home folder — the proton system tree is read-only. A name that already exists gets “ (2)” appended.`,
        onSubmit: (raw) => {
          const wanted = FS.normalize(raw);
          const isDir = !FS.extname(wanted) || FS.stat(wanted)?.type === 'dir';
          const dir = isDir ? wanted : FS.dirname(wanted);
          const name = isDir ? 'untitled.txt' : FS.basename(wanted);
          if (!FS.isWritable(dir)) throw new Error(`Read-only file system: ${dir} — create files inside ${HOME}`);
          if (FS.stat(dir)?.type !== 'dir') throw new Error(`No such folder: ${dir}`);
          const p = FS.join(dir, uniqueName(dir, name));
          FS.write(p, '');
          MH.toast(`Created ${p}`);
          load(p);
        },
      });
    }

    /* ------------------------------ loading ----------------------------- */
    async function load(p) {
      const target = FS.normalize(p);
      const st = FS.stat(target);
      if (!st || st.type !== 'file') { MH.toast(`No such file: ${target}`); return; }
      if (FS.isBinary(target)) { MH.toast('That file is binary — open it from Files with its own app.'); return; }
      if (dirty && path && path !== target && !confirmBox(`Discard the unsaved changes in ${FS.basename(path)}?`)) return;
      const token = ++loading;
      path = target;
      deviceName = '';
      dirty = false;
      syncButtons();
      say(`Opening <b>${esc(target)}</b>…`);
      try {
        const text = await FS.read(target);
        if (token !== loading) return; // a newer file won
        editorScreen(text);
        say(FS.isWritable(target)
          ? `Editing <b>${esc(target)}</b> — saved in this browser, under your account. <b>Ctrl+S</b> saves.`
          : `<b>${esc(target)}</b> is part of the read-only proton system: edit the draft freely,
             then save the copy into your home folder — the original never changes.
             <button class="btn sm" type="button" data-act>${iconSvg('copy')} Save a copy to your home folder</button>`);
      } catch (err) {
        if (token !== loading) return;
        path = null;
        MH.toast(`Could not open ${FS.basename(target)}: ${err.message}`);
        startScreen();
      }
    }
    /* Save and Save a copy both ask which file system to save to. */
    async function save() {
      const area = q('#te-text');
      if (!area) return;
      const dest = await MH.askFileSource('save');
      if (!dest) return;
      if (dest === 'device') {
        MH.downloadBlob(deviceName || (path ? FS.basename(path) : 'untitled.txt'),
          new Blob([area.value], { type: 'text/plain;charset=utf-8' }));
        dirty = false; updateStatus();
        MH.toast('Saved to your Files (this computer).');
        return;
      }
      if (path && FS.isWritable(path)) {
        try {
          FS.write(path, area.value);
          dirty = false;
          updateStatus();
          MH.toast(`Saved ${FS.basename(path)}`);
        } catch (err) { MH.toast(err.message); }
        return;
      }
      saveCopyToVfs(); // read-only or device-open file: name it inside proton first
    }
    function saveCopy() {
      MH.askFileSource('save').then((dest) => {
        if (dest === 'device') {
          const area = q('#te-text');
          if (!area) return;
          MH.downloadBlob(deviceName || (path ? FS.basename(path) : 'untitled.txt'),
            new Blob([area.value], { type: 'text/plain;charset=utf-8' }));
          MH.toast('Saved to your Files (this computer).');
        } else if (dest === 'vfs') saveCopyToVfs();
      });
    }
    function saveCopyToVfs() {
      if (!path && !deviceName) return;
      const suggested = path && FS.isWritable(path) ? path : FS.join(HOME, uniqueName(HOME, path ? FS.basename(path) : deviceName));
      askForm({
        title: 'Save a copy to…', value: suggested, ok: 'Save copy',
        list: [HOME, ...userData.dirs.slice().sort()],
        help: 'The original stays exactly as it is; the copy goes inside your home folder.',
        onSubmit: (raw) => {
          const p = FS.normalize(raw);
          if (FS.stat(p)?.type === 'dir') throw new Error(`That is a folder: ${p}`);
          if (!FS.isWritable(p)) throw new Error(`Read-only file system: ${p}`);
          FS.write(p, q('#te-text')?.value ?? '');
          MH.toast(`Saved ${p}`);
          load(p);
        },
      });
    }

    /* ------------------------------- events ----------------------------- */
    q('#te-open').onclick = askOpen;
    q('#te-new').onclick = askNew;
    q('#te-save').onclick = save;
    q('#te-copy').onclick = saveCopy;
    q('#te-files').onclick = () => openApp('files', {
      path: path ? FS.dirname(path) : HOME, select: path || undefined,
    });
    body.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    });
    body.openPath = ({ path: p } = {}) => { if (p) load(p); };
    body.beforeClose = () => (!dirty || confirmBox(`Discard the unsaved changes in ${path ? FS.basename(path) : (deviceName || 'this draft')}?`));

    /* ------------------------------- start ------------------------------ */
    if (options.path) load(options.path);
    else startScreen();
  },
});
</script>
</body>
</html>
