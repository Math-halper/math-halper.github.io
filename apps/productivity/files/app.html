<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Files</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: files — the file manager for proton's virtual file
 * system. Loaded by index.html; calls registerApp() (see apps/README.md).
 *
 * One tree, two layers (assets/fs.js):
 *   /                every file of this website — read-only, listed in
 *                    data/fs-manifest.js, fetched over HTTP when opened
 *   /home/<you>/     this account's own folders and files — read-write, kept
 *                    in userData.dirs / userData.files (this browser only)
 *
 * Everything goes through the FS API (list, stat, read, write, writeBlob,
 * mkdir, rename, rm, copy, count, find), so the account data stays the single
 * source of truth, and FS.watch() keeps this window, the desktop shortcuts and
 * any open viewer in sync. FS.appFor() decides which app opens a file: Browser
 * for .html, PDF Viewer for .pdf, Image Viewer for images, Media for
 * audio/video, Text Editor for other text — and Files itself is the fallback
 * for anything with no viewer (see openFSItem in assets/core.js).
 *
 * Imports keep the two storage layers straight: a text file (by MIME type or
 * extension) is written with FS.write() so it stays readable and editable, and
 * anything else with FS.writeBlob() as exact bytes, up to FS.MAX_BLOB_SIZE each.
 * Downloads go the other way — one file as itself, several (or a folder) as a
 * ZIP built by assets/fs-archive.js.
 *
 * Prompts are inline forms (.fm-ask), never window.prompt(): they work in every
 * embedding context, they are testable, and they can offer a datalist of real
 * folders instead of asking anyone to type an absolute path from memory.
 */
'use strict';

registerApp({
  render(body, options) {
    /* ------------------------------ state ------------------------------ */
    const HOME = FS.home();
    const IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'bmp', 'ico', 'svg'];
    let cwd = folderOr(options.path, HOME);
    let view = 'list';       // 'list' | 'grid'
    let filter = '';         // live filter for the current folder
    let results = null;      // recursive search results (stats), or null
    let sortKey = 'name';    // name | size | updated
    const sel = new Set();   // selected paths
    let anchor = null;       // shift-click anchor
    let askSeq = 0;          // the newest inline prompt wins
    const unwatch = FS.watch(() => { if (body.isConnected) draw(); });

    const q = (s) => body.querySelector(s);
    const esc = MH.esc;

    function folderOr(path, fallback) {
      const st = FS.stat(FS.normalize(path ?? fallback));
      if (st?.type === 'dir') return st.path;
      if (st?.type === 'file') return FS.dirname(st.path);
      return fallback;
    }
    const writable = () => FS.isWritable(cwd);
    const selected = () => [...sel].filter((p) => FS.stat(p));
    /* Actions apply to the whole selection when the clicked item is part of it. */
    const target = (path) => (sel.has(path) && sel.size > 1 ? selected() : [path]);
    const dirLabel = (st) => (st.path === HOME ? 'your home' : FS.isWritable(st.path) ? 'folder' : 'system');

    /* ------------------------------ icons ------------------------------ */
    function iconForEntry(st) {
      if (st.type === 'dir') return st.path === cwd ? 'folder-open' : 'folder';
      const ext = FS.extname(st.path);
      if (ext === 'pdf') return 'book';
      if (IMAGE_EXT.includes(ext)) return 'image';
      if (FS.mediaKind(st.path) === 'audio') return 'music';
      if (FS.mediaKind(st.path)) return 'film';
      if (['html', 'htm'].includes(ext)) return 'globe';
      if (['zip', 'gz', 'tar'].includes(ext)) return 'database';
      return FS.isBinary(st.path) ? 'file' : 'file-text';
    }

    /* ----------------------------- entries ----------------------------- */
    function entries() {
      let list;
      if (results) list = results.slice();
      else {
        try { list = FS.list(cwd); }
        catch (err) { MH.toast(err.message); cwd = HOME; list = FS.list(cwd); }
      }
      const needle = filter.trim().toLowerCase();
      if (needle) list = list.filter((e) => e.name.toLowerCase().includes(needle));
      if (sortKey !== 'name') {
        list.sort((a, b) => (a.type === b.type
          ? (b[sortKey] || 0) - (a[sortKey] || 0) || a.name.localeCompare(b.name)
          : a.type === 'dir' ? -1 : 1));
      }
      return list;
    }
    /* Never overwrite silently: "photo.png" becomes "photo (2).png". */
    function uniqueName(dir, name) {
      if (!FS.exists(FS.join(dir, name))) return name;
      const dot = name.lastIndexOf('.');
      const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
      for (let i = 2; i < 500; i++) {
        const candidate = `${base} (${i})${ext}`;
        if (!FS.exists(FS.join(dir, candidate))) return candidate;
      }
      return `${base} (${Date.now()})${ext}`;
    }
    /* Imported names come from the operating system: drop any path separators
     * or control characters before they reach the file system. */
    const safeName = (raw) => (String(raw ?? '').split(/[\\/]/).pop() || '')
      .replace(/[\u0000-\u001f]/g, '').trim().slice(0, 180) || 'imported file';
    const knownFolders = () => [HOME, ...userData.dirs.slice().sort()].filter((d) => FS.stat(d)?.type === 'dir');

    /* --------------------------- inline prompt -------------------------- */
    function ask({ title, value = '', placeholder = '', note = '', ok = 'OK', folders = false, onSubmit }) {
      const host = q('#fm-ask'), token = ++askSeq;
      host.hidden = false;
      host.innerHTML = `<div class="field"><label for="fm-ask-input">${esc(title)}</label></div>
        <div class="fm-ask-row"><input id="fm-ask-input" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}"
          ${folders ? 'list="fm-ask-folders"' : ''} autocomplete="off" spellcheck="false">
          <button class="btn sm primary" type="button" data-ok>${esc(ok)}</button>
          <button class="btn sm" type="button" data-cancel>Cancel</button></div>
        ${folders ? `<datalist id="fm-ask-folders">${knownFolders().map((d) => `<option value="${esc(d)}"></option>`).join('')}</datalist>` : ''}
        ${note ? `<p class="fm-ask-note">${note}</p>` : ''}`;
      const input = host.querySelector('#fm-ask-input');
      const close = () => { if (token === askSeq) { host.hidden = true; host.innerHTML = ''; } };
      const submit = () => {
        const typed = input.value.trim();
        if (!typed) { input.focus(); return; }
        close();
        /* onSubmit may be async: report its rejection instead of losing it. */
        try { Promise.resolve(onSubmit(typed)).catch((err) => MH.toast(err.message)); }
        catch (err) { MH.toast(err.message); }
      };
      host.querySelector('[data-ok]').onclick = submit;
      host.querySelector('[data-cancel]').onclick = close;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); close(); }
      };
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      return close;
    }
    function showProps(paths) {
      const host = q('#fm-ask'), token = ++askSeq;
      const counts = FS.count();
      const cards = paths.map((p) => {
        const st = FS.stat(p);
        if (!st) return '';
        return `<dl class="fm-props">
          <div><dt>Name</dt><dd>${esc(st.name)}</dd></div>
          <div><dt>Path</dt><dd>${esc(st.path)}</dd></div>
          <div><dt>Kind</dt><dd>${st.type === 'dir' ? 'Folder' : (FS.extname(st.path) || 'file').toUpperCase() + ' file'}</dd></div>
          <div><dt>Size</dt><dd>${st.type === 'dir' ? (st.path === HOME ? `${counts.files} files, ${counts.dirs} folders` : '—') : MH.fmtBytes(st.size)}</dd></div>
          <div><dt>Modified</dt><dd>${st.updated ? new Date(st.updated).toLocaleString() : '—'}</dd></div>
          <div><dt>Layer</dt><dd>${st.user ? 'Your account (read-write)' : 'proton system (read-only)'}</dd></div>
          ${st.type === 'file' ? `<div><dt>Opens with</dt><dd>${esc(APPS[FS.appFor(st.path)]?.name || 'Files — no viewer for this kind of file')}</dd></div>` : ''}
        </dl>`;
      }).join('');
      host.hidden = false;
      host.innerHTML = `<div class="fm-ask-row" style="align-items:flex-start;justify-content:space-between">
          <div style="flex:1;min-width:0;display:grid;gap:8px">${cards}</div>
          <button class="btn sm" type="button" data-close>Close</button></div>`;
      host.querySelector('[data-close]').onclick = () => { if (token === askSeq) { host.hidden = true; host.innerHTML = ''; } };
    }

    /* ------------------------------ actions ----------------------------- */
    function nav(path) {
      const st = FS.stat(FS.normalize(path));
      if (!st) { MH.toast(`No such folder: ${path}`); return; }
      if (st.type !== 'dir') { openFSItem(st.path); return; }
      cwd = st.path;
      results = null;
      sel.clear();
      anchor = null;
      draw();
    }
    function newFolder() {
      if (!writable()) { MH.toast('This folder is read-only — create folders inside your home folder.'); return; }
      ask({
        title: 'New folder in ' + cwd, value: 'New folder', ok: 'Create',
        onSubmit: (name) => {
          const path = FS.join(cwd, safeName(name));
          FS.mkdir(path);
          MH.toast(`Created ${path}`);
          sel.clear(); sel.add(path); anchor = path;
        },
      });
    }
    function newFile() {
      if (!writable()) { MH.toast('This folder is read-only — create files inside your home folder.'); return; }
      ask({
        title: 'New text file in ' + cwd, value: 'untitled.txt', ok: 'Create',
        note: 'Created empty and opened in the Text Editor. Use <b>Import</b> for images, audio, video or PDFs.',
        onSubmit: (name) => {
          const path = FS.join(cwd, uniqueName(cwd, safeName(name)));
          FS.write(path, '');
          MH.toast(`Created ${path}`);
          sel.clear(); sel.add(path); anchor = path;
          openFSItem(path);
        },
      });
    }
    function rename(path) {
      const st = FS.stat(path);
      if (!st) return;
      if (!FS.isWritable(path)) { MH.toast('That item is part of the read-only proton system.'); return; }
      ask({
        title: `Rename ${st.name}`, value: st.name, ok: 'Rename',
        note: `It stays in <b>${esc(FS.dirname(path))}</b>. Desktop shortcuts pointing at it follow automatically.`,
        onSubmit: (name) => {
          const to = FS.join(FS.dirname(path), safeName(name));
          FS.rename(path, to);
          sel.clear(); sel.add(to); anchor = to;
          MH.toast(`Renamed to ${FS.basename(to)}`);
        },
      });
    }
    function transfer(paths, mode) {
      const title = mode === 'move' ? 'Move' : 'Copy';
      ask({
        title: `${title} ${paths.length === 1 ? FS.basename(paths[0]) : paths.length + ' items'} to…`,
        value: cwd === HOME ? FS.join(HOME, 'Documents') : cwd,
        placeholder: HOME, ok: title, folders: true,
        note: `Type a folder or choose one from the list. Only folders inside <b>${esc(HOME)}</b> are writable.`,
        onSubmit: async (raw) => {
          const dir = FS.normalize(raw);
          if (FS.stat(dir)?.type !== 'dir') throw new Error(`No such folder: ${dir}`);
          if (!FS.isWritable(dir)) throw new Error(`Read-only file system: ${dir}`);
          let done = 0;
          for (const path of paths) {
            if (path === dir || dir.startsWith(path + '/')) continue; // never into itself
            if (mode === 'move' && FS.dirname(path) === dir) continue;
            const to = FS.join(dir, uniqueName(dir, FS.basename(path)));
            if (mode === 'move') FS.rename(path, to);
            else await FS.copy(path, to);
            done++;
          }
          MH.toast(done
            ? `${title === 'Move' ? 'Moved' : 'Copied'} ${done} item${done === 1 ? '' : 's'} to ${dir}`
            : `Nothing to ${mode} — those items are already in ${dir}.`);
          if (mode === 'move') sel.clear();
          draw();
        },
      });
    }
    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    async function download(paths) {
      if (!paths.length) { MH.toast('Select a file or folder to download first.'); return; }
      try {
        const only = paths.length === 1 ? FS.stat(paths[0]) : null;
        if (only?.type === 'file') {
          saveBlob(await FS.readBlob(only.path), only.name);
          MH.toast(`Downloaded ${only.name}`);
          return;
        }
        if (paths.includes('/') || paths.includes('/home')) {
          MH.toast('Choose a folder or file to download — not the whole system root.');
          return;
        }
        const label = paths.length === 1 ? FS.basename(paths[0]) : `proton-${paths.length}-items`;
        saveBlob(await FS_ARCHIVE.zip(paths), `${label}.zip`);
        MH.toast(`Downloaded ${label}.zip`);
      } catch (err) { MH.toast(err.message); }
    }
    function remove(paths) {
      const names = paths.map((p) => FS.basename(p));
      const label = names.length === 1 ? names[0] : `${names.length} items`;
      if (!confirmBox(`Delete ${label} from your account? This cannot be undone.`)) return;
      try {
        for (const path of paths) FS.rm(path, '/', true);
        sel.clear();
        MH.toast(`Deleted ${label}.`);
        draw();
      } catch (err) { MH.toast(err.message); }
    }
    /* Read an imported file as text: File.text() where the browser has it,
     * FileReader elsewhere (same trick the desktop uses for uploads). */
    function readAsText(file) {
      if (typeof file.text === 'function') return file.text();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result ?? ''));
        reader.onerror = () => reject(new Error(`Could not read ${file.name || 'that file'}.`));
        reader.readAsText(file);
      });
    }
    /* Text goes in as text (FS.write) so it stays editable and openable —
     * an imported notes.txt opens in the Text Editor, an imported page opens
     * in the Browser. Everything else goes in as exact bytes (FS.writeBlob),
     * which is what pictures, audio, video and PDFs need. */
    const TEXT_EXT = ['txt', 'md', 'markdown', 'js', 'mjs', 'cjs', 'json', 'css', 'csv', 'tsv',
      'xml', 'yml', 'yaml', 'ini', 'log', 'svg', 'html', 'htm', 'text', 'conf', 'sh', 'py'];
    function looksLikeText(file) {
      const ext = FS.extname(file.name || '');
      if (FS.BINARY_EXT.has(ext)) return false;
      return /^text\//i.test(file.type || '') || TEXT_EXT.includes(ext);
    }
    /* Copy files between folders in the proton file system (the "other side"
     * of Import/Download when the proton file system is chosen). Text stays
     * text, everything else moves as exact bytes. */
    async function copyInto(dest, srcs) {
      if (!FS.isWritable(dest)) { MH.toast('That folder is read-only — copy into your home folder instead.'); return; }
      let done = 0;
      for (const src of srcs) {
        try {
          const st = FS.stat(src);
          if (!st || st.type !== 'file') { MH.toast(`Skipping ${src} — only files can be copied here.`); continue; }
          const target = FS.join(dest, uniqueName(dest, st.name));
          if (FS.isBinary(src)) await FS.writeBlob(target, await FS.readBlob(src));
          else FS.write(target, await FS.read(src));
          sel.add(target);
          done++;
        } catch (err) { MH.toast(err.message); break; }
      }
      if (done) {
        MH.toast(`Copied ${done} file${done === 1 ? '' : 's'} into ${dest}`);
        draw();
      }
    }
    function importFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      if (!writable()) { MH.toast('This folder is read-only — import into your home folder instead.'); return; }
      (async () => {
        let done = 0, asText = 0;
        for (const file of files) {
          try {
            const path = FS.join(cwd, uniqueName(cwd, safeName(file.name)));
            if (looksLikeText(file)) { FS.write(path, await readAsText(file)); asText++; }
            else await FS.writeBlob(path, file);
            sel.add(path);
            done++;
          } catch (err) { MH.toast(err.message); break; } // storage full: stop and keep the message
        }
        if (done) {
          MH.toast(`Imported ${done} file${done === 1 ? '' : 's'} into ${cwd}`
            + (asText ? ` (${asText} as editable text)` : ''));
        }
        draw();
      })().catch((err) => MH.toast(err.message));
    }
    function search() {
      const needle = q('#fm-search').value.trim();
      if (!needle) { results = null; draw(); return; }
      try {
        results = FS.find(needle, cwd);
        sel.clear();
        draw();
        MH.toast(`${results.length} match${results.length === 1 ? '' : 'es'} for “${needle}” under ${cwd}`);
      } catch (err) { MH.toast(err.message); }
    }

    /* --------------------------- context menu --------------------------- */
    function closeMenu() { q('#fm-menu')?.remove(); }
    function openWithCandidates(st) {
      const out = [], ext = FS.extname(st.path), binary = FS.isBinary(st.path);
      const add = (id) => { if (id && APPS[id] && !out.some((x) => x.id === id)) out.push({ id, name: APPS[id].name }); };
      add(FS.appFor(st.path));
      if (['html', 'htm'].includes(ext)) add('browser');
      if (IMAGE_EXT.includes(ext)) add('image-viewer');
      if (FS.mediaKind(st.path)) add('media');
      if (ext === 'pdf') add('pdf');
      if (!binary) add('text-editor');
      return out;
    }
    function menu(e, paths) {
      e.preventDefault();
      closeMenu();
      const host = document.createElement('div');
      host.className = 'fm-menu'; host.id = 'fm-menu'; host.setAttribute('role', 'menu');
      body.appendChild(host);
      const actions = [];
      const add = (label, icon, run, disabled = false) => actions.push({ label, icon, run, disabled });
      const one = paths.length === 1 ? FS.stat(paths[0]) : null;
      const allWritable = paths.every((p) => FS.isWritable(p));
      if (one) {
        add('Open', one.type === 'dir' ? 'folder-open' : 'external',
          () => (one.type === 'dir' ? nav(one.path) : openFSItem(one.path)));
      }
      if (one?.type === 'file') for (const app of openWithCandidates(one)) add(`Open in ${app.name}`, 'grid', () => openApp(app.id, { path: one.path }));
      if (paths.length > 1) add(`Open ${paths.length} files`, 'external', () => paths.forEach((p) => { if (FS.stat(p)?.type === 'file') openFSItem(p); }));
      actions.push(null);
      if (one) add('Properties', 'info', () => showProps(paths));
      add('Add desktop shortcut', 'pin', () => paths.forEach((p) => DesktopIcons.addPath(p)), typeof DesktopIcons?.addPath !== 'function');
      add('Download', 'download', () => download(paths));
      actions.push(null);
      add('Rename…', 'edit', () => rename(paths[0]), !one || !allWritable);
      add('Move to…', 'paste', () => transfer(paths, 'move'), !allWritable);
      add('Copy to…', 'copy', () => transfer(paths, 'copy'), !allWritable);
      add('Delete', 'trash', () => remove(paths), !allWritable);
      host.innerHTML = actions.map((action, i) => (action
        ? `<button type="button" role="menuitem" data-a="${i}"${action.disabled ? ' disabled' : ''}>${iconSvg(action.icon)}${esc(action.label)}</button>`
        : '<div class="fm-menu-rule" role="separator"></div>')).join('');
      host.querySelectorAll('[data-a]').forEach((button) => {
        button.onclick = () => { const run = actions[+button.dataset.a].run; closeMenu(); run(); };
      });
      host.hidden = false;
      const box = body.getBoundingClientRect();
      host.style.left = `${Math.max(4, Math.min(e.clientX - box.left, body.clientWidth - host.offsetWidth - 6))}px`;
      host.style.top = `${Math.max(4, Math.min(e.clientY - box.top, body.clientHeight - host.offsetHeight - 6))}px`;
      host.querySelector('button:not([disabled])')?.focus();
      const away = (ev) => {
        if (host.contains(ev.target)) return;
        closeMenu();
        window.removeEventListener('pointerdown', away, true);
      };
      window.addEventListener('pointerdown', away, true);
    }

    /* ------------------------------ drawing ----------------------------- */
    function crumbs() {
      const parts = cwd.split('/').filter(Boolean);
      const out = [`<button type="button" class="fm-crumb" data-go="/" aria-current="${cwd === '/'}">${iconSvg('monitor')} /</button>`];
      parts.forEach((part, i) => {
        const path = '/' + parts.slice(0, i + 1).join('/');
        out.push(`<span class="fm-sep" aria-hidden="true">›</span><button type="button" class="fm-crumb" data-go="${esc(path)}" aria-current="${path === cwd}">${esc(path === HOME ? 'Home' : part)}</button>`);
      });
      return out.join('');
    }
    function places() {
      const place = (label, path, icon) => (FS.stat(path)
        ? `<button type="button" class="fm-place${cwd === path ? ' sel' : ''}" data-go="${esc(path)}">${iconSvg(icon)}<span>${esc(label)}</span></button>`
        : '');
      const system = FS.list('/').filter((e) => e.type === 'dir' && e.path !== '/home')
        .map((e) => place(e.name, e.path, 'folder')).join('');
      return `<h3>Your folders</h3>
        ${place('Home', HOME, 'home')}
        ${['Desktop', 'Documents', 'Downloads', 'Pictures'].map((d) => place(d, FS.join(HOME, d), 'folder')).join('')}
        <h3>proton system <span class="muted">(read-only)</span></h3>
        ${place('Computer', '/', 'monitor')}
        ${system}`;
    }
    function statusText(list) {
      const counts = FS.count(), picked = selected();
      const files = list.filter((e) => e.type === 'file').length;
      const dirs = list.filter((e) => e.type === 'dir').length;
      const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
      const where = results
        ? `<span><b>${list.length}</b> ${list.length === 1 ? 'match' : 'matches'} under ${esc(cwd)}</span>`
        : `<span><b>${plural(files, 'file')}</b>, <b>${plural(dirs, 'folder')}</b> in ${esc(cwd === HOME ? 'Home' : cwd)}</span>`;
      const pickedText = picked.length
        ? `<span>Selected <b>${picked.length}</b> · ${MH.fmtBytes(picked.reduce((n, p) => n + (FS.stat(p)?.size || 0), 0))}</span>` : '';
      return `${where}${pickedText}<span style="margin-left:auto">Your home: <b>${plural(counts.files, 'file')}</b>, <b>${plural(counts.dirs, 'folder')}</b>, ${MH.fmtBytes(counts.bytes)}${writable() ? '' : ' · this folder is read-only'}</span>`;
    }
    function row(st) {
      const isSel = sel.has(st.path);
      return `<button type="button" role="option" aria-selected="${isSel}" class="fm-row${isSel ? ' sel' : ''}"
        data-path="${esc(st.path)}" data-kind="${st.type}" draggable="true" title="${esc(st.path)}">
        ${iconSvg(iconForEntry(st))}<span class="fm-name">${esc(st.name)}</span>
        <span class="fm-meta">${st.type === 'dir' ? esc(dirLabel(st)) : MH.fmtBytes(st.size)}</span>
        <span class="fm-meta">${st.updated ? new Date(st.updated).toLocaleDateString() : st.user ? '' : 'read-only'}</span></button>`;
    }
    function tile(st) {
      const isSel = sel.has(st.path);
      return `<button type="button" role="option" aria-selected="${isSel}" class="fm-tile${isSel ? ' sel' : ''}"
        data-path="${esc(st.path)}" data-kind="${st.type}" draggable="true" title="${esc(st.path)}">
        ${iconSvg(iconForEntry(st))}<b>${esc(st.name)}</b>
        <small>${st.type === 'dir' ? esc(dirLabel(st)) : MH.fmtBytes(st.size)}</small></button>`;
    }
    function emptyState() {
      const needle = filter || q('#fm-search')?.value.trim() || '';
      return `<div class="fm-empty">${iconSvg(results || needle ? 'search' : 'folder-open')}<p>${results || needle
        ? `Nothing under <b>${esc(cwd)}</b> matches “${esc(needle)}”.`
        : writable()
          ? 'This folder is empty. Use <b>New file</b>, <b>New folder</b> or <b>Import</b> — or drop files from your computer here.'
          : 'This proton system folder holds no files of its own.'}</p></div>`;
    }
    function draw() {
      const list = entries();
      for (const path of [...sel]) if (!FS.stat(path)) sel.delete(path);
      const side = q('#fm-side'), crumbsBox = q('#fm-crumbs'), scroll = q('#fm-scroll');
      if (!side || !crumbsBox || !scroll) return; // closed mid-draw
      side.innerHTML = places();
      crumbsBox.innerHTML = crumbs();
      q('#fm-up').disabled = cwd === '/';
      q('#fm-path').value = results ? `${cwd}  ·  search results` : cwd;
      q('#fm-view').innerHTML = view === 'list' ? `${iconSvg('grid')} Tiles` : `${iconSvg('layers')} List`;
      body.querySelectorAll('[data-write]').forEach((el) => { el.disabled = !writable(); });
      scroll.className = 'fm-scroll';
      scroll.setAttribute('aria-label', `Contents of ${cwd}`);
      scroll.innerHTML = list.length
        ? `<div class="${view === 'list' ? 'fm-list' : 'fm-grid'}" role="listbox" aria-multiselectable="true" aria-label="Files and folders in ${esc(cwd)}">${list.map(view === 'list' ? row : tile).join('')}</div>`
        : emptyState();
      wireEntries(scroll, list);
      q('#fm-status').innerHTML = statusText(list);
      const del = q('#fm-delete');
      if (del) del.disabled = !selected().length || !selected().every((p) => FS.isWritable(p));
      const clear = q('#fm-clear');
      if (clear) clear.hidden = !results;
      side.querySelectorAll('[data-go]').forEach((b) => { b.onclick = () => nav(b.dataset.go); });
      crumbsBox.querySelectorAll('[data-go]').forEach((b) => { b.onclick = () => nav(b.dataset.go); });
    }

    /* -------------------------- entries: wiring ------------------------- */
    function wireEntries(scroll, list) {
      const paths = list.map((e) => e.path);
      const focusPath = (path) => {
        const el = [...scroll.querySelectorAll('[data-path]')].find((x) => x.dataset.path === path);
        el?.focus({ preventScroll: false });
      };
      const pick = (e, path) => {
        if (e.shiftKey && anchor) {
          const a = paths.indexOf(anchor), b = paths.indexOf(path);
          if (a >= 0 && b >= 0) {
            sel.clear();
            for (const p of paths.slice(Math.min(a, b), Math.max(a, b) + 1)) sel.add(p);
          }
        } else if (e.ctrlKey || e.metaKey) {
          if (sel.has(path)) sel.delete(path); else sel.add(path);
          anchor = path;
        } else { sel.clear(); sel.add(path); anchor = path; }
        draw();
      };
      const open = (path, kind) => { if (kind === 'dir') nav(path); else openFSItem(path); };
      scroll.querySelectorAll('[data-path]').forEach((el) => {
        const path = el.dataset.path, kind = el.dataset.kind;
        /* A plain click opens the folder or file. This also fixes real
         * double-clicks: picking used to re-render the row after the first
         * click, so the second click landed on a replacement element and no
         * dblclick ever reached the original row. Ctrl/Cmd-click and
         * Shift-click stay selection-only for multi-select actions. */
        el.onclick = (e) => {
          if (e.ctrlKey || e.metaKey || e.shiftKey) { pick(e, path); return; }
          sel.clear(); sel.add(path); anchor = path;
          open(path, kind);
        };
        el.ondblclick = () => open(path, kind);
        el.oncontextmenu = (e) => {
          if (!sel.has(path)) { sel.clear(); sel.add(path); anchor = path; draw(); }
          menu(e, target(path));
        };
        el.onkeydown = (e) => {
          if (e.key === 'Enter') { e.preventDefault(); open(path, kind); }
          else if (e.key === ' ') { e.preventDefault(); pick(e, path); }
          else if (e.key === 'F2') { e.preventDefault(); rename(path); }
          else if (e.key === 'Delete') {
            e.preventDefault();
            const many = target(path).filter((p) => FS.isWritable(p));
            if (many.length) remove(many); else MH.toast('Nothing selected can be deleted — the proton system tree is read-only.');
          } else if (e.key === 'ContextMenu') { e.preventDefault(); menu(e, target(path)); }
        };
        el.ondragstart = (e) => {
          if (!e.dataTransfer) return;
          const many = target(path);
          e.dataTransfer.setData('application/x-proton-path', path);
          e.dataTransfer.setData('application/x-proton-paths', JSON.stringify(many));
          e.dataTransfer.setData('text/plain', FS.basename(path));
          e.dataTransfer.effectAllowed = 'copyMove';
        };
        el.ondragend = () => scroll.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop'));
        if (kind !== 'dir') return;
        /* Dropping a selection on a folder moves it there (FS.rename). */
        el.ondragover = (e) => {
          if (!Array.from(e.dataTransfer?.types || []).includes('application/x-proton-path')) return;
          const from = e.dataTransfer.getData('application/x-proton-path');
          if (from === path || path.startsWith(from + '/')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          el.classList.add('drop');
        };
        el.ondragleave = () => el.classList.remove('drop');
        el.ondrop = (e) => {
          el.classList.remove('drop');
          let many = [];
          try { many = JSON.parse(e.dataTransfer.getData('application/x-proton-paths') || '[]'); } catch { many = []; }
          if (!Array.isArray(many) || !many.length) many = [e.dataTransfer.getData('application/x-proton-path')].filter(Boolean);
          many = many.filter((p) => p && p !== path && !path.startsWith(p + '/') && FS.isWritable(p));
          if (!many.length) return;
          e.preventDefault();
          let done = 0;
          for (const from of many) {
            if (FS.dirname(from) === path) continue;
            try { FS.rename(from, FS.join(path, uniqueName(path, FS.basename(from)))); done++; }
            catch (err) { MH.toast(err.message); }
          }
          if (done) MH.toast(`Moved ${done} item${done === 1 ? '' : 's'} into ${FS.basename(path)}`);
          sel.clear();
          draw();
        };
      });
      /* Clicking the empty space clears the selection. */
      scroll.onclick = (e) => {
        if (e.target.closest('[data-path]')) return;
        if (sel.size) { sel.clear(); draw(); }
      };
      /* Drop files from the computer into the current folder. */
      scroll.ondragover = (e) => {
        if (!Array.from(e.dataTransfer?.types || []).includes('Files')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        scroll.classList.add('drop');
      };
      scroll.ondragleave = (e) => {
        if (!e.relatedTarget || !scroll.contains(e.relatedTarget)) scroll.classList.remove('drop');
      };
      scroll.ondrop = (e) => {
        scroll.classList.remove('drop');
        if (!Array.from(e.dataTransfer?.types || []).includes('Files')) return;
        e.preventDefault();
        importFiles(e.dataTransfer.files);
      };
      /* Arrow-key navigation for the whole list. */
      scroll.onkeydown = (e) => {
        if (!paths.length || !e.key.startsWith('Arrow')) return;
        const at = paths.indexOf(document.activeElement?.dataset?.path);
        if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); nav(FS.dirname(cwd)); return; }
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const next = paths[Math.max(0, Math.min(paths.length - 1, (at < 0 ? 0 : at) + (e.key === 'ArrowDown' ? 1 : -1)))];
        if (!next) return;
        sel.clear(); sel.add(next); anchor = next;
        draw();
        focusPath(next);
      };
    }

    /* ------------------------------- chrome ----------------------------- */
    body.innerHTML = `${bar('Files', `<button class="btn sm" type="button" id="fm-new-folder" data-write>${iconSvg('plus')} New folder</button>
        <button class="btn sm" type="button" id="fm-new-file" data-write>${iconSvg('file-text')} New file</button>
        <button class="btn sm" type="button" id="fm-import" data-write title="Copy files from your computer into this folder — text stays editable, everything else is stored as exact bytes (2 MB each)">${iconSvg('upload')} Import</button>
        <button class="btn sm" type="button" id="fm-download">${iconSvg('download')} Download</button>
        <button class="btn sm" type="button" id="fm-view">${iconSvg('grid')} Tiles</button>
        <button class="btn sm" type="button" id="fm-refresh">${iconSvg('refresh')} Refresh</button>`)}
      <div class="appbar fm-nav">
        <button class="btn sm" type="button" id="fm-up" title="Up one folder (Alt+↑)">↑ Up</button>
        <div class="fm-crumbs" id="fm-crumbs"></div>
        <input id="fm-path" type="text" aria-label="Folder path" spellcheck="false" autocomplete="off" style="flex:1;min-width:150px;padding:6px 9px">
        <button class="btn sm primary" type="button" id="fm-go">Go</button>
        <input id="fm-search" type="search" aria-label="Search this folder and everything under it" placeholder="Search under here…" style="min-width:150px">
        <input id="fm-file" type="file" multiple hidden>
      </div>
      <div class="app-main fm-body">
        <div class="split">
          <div class="side fm-side" id="fm-side"></div>
          <div class="fm-pane">
            <div class="fm-toolbar">
              <input id="fm-filter" type="search" placeholder="Filter this folder…" aria-label="Filter this folder" style="flex:1;min-width:130px;padding:6px 9px">
              <select id="fm-sort" aria-label="Sort by" title="Sort by">
                <option value="name">Name</option><option value="size">Size</option><option value="updated">Modified</option>
              </select>
              <button class="btn sm" type="button" id="fm-clear" hidden>${iconSvg('x')} Clear search</button>
              <button class="btn sm" type="button" id="fm-select-all">Select all</button>
              <button class="btn sm danger" type="button" id="fm-delete" data-write>${iconSvg('trash')} Delete</button>
            </div>
            <div class="fm-ask" id="fm-ask" hidden></div>
            <div class="fm-scroll" id="fm-scroll" tabindex="0"></div>
          </div>
        </div>
      </div>
      <div class="fm-status" id="fm-status"></div>`;

    /* ------------------------------- events ----------------------------- */
    q('#fm-up').onclick = () => nav(FS.dirname(cwd));
    q('#fm-go').onclick = () => nav(q('#fm-path').value);
    q('#fm-path').addEventListener('keydown', (e) => { if (e.key === 'Enter') nav(e.target.value); });
    q('#fm-search').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
    q('#fm-filter').oninput = (e) => { filter = e.target.value; results = null; draw(); };
    q('#fm-sort').onchange = (e) => { sortKey = e.target.value; draw(); };
    q('#fm-view').onclick = () => { view = view === 'list' ? 'grid' : 'list'; draw(); };
    q('#fm-refresh').onclick = () => { draw(); MH.toast('Refreshed.'); };
    q('#fm-new-folder').onclick = newFolder;
    q('#fm-new-file').onclick = newFile;
    /* Import and Download both ask which file system to use: the device's own
     * file pickers, or the proton file system (copying into/out of it). */
    q('#fm-import').onclick = () => {
      MH.askFileSource('open').then((src) => {
        if (src === 'device') q('#fm-file').click();
        else if (src === 'vfs') {
          if (!writable()) { MH.toast('This folder is read-only — import into your home folder instead.'); return; }
          MH.vfsPick({ title: 'Import from the proton file system' }).then((p) => {
            if (p) copyInto(cwd, [p]);
          });
        }
      });
    };
    q('#fm-file').onchange = (e) => { importFiles(e.target.files); e.target.value = ''; };
    q('#fm-download').onclick = () => {
      const paths = selected().length ? selected() : [cwd];
      MH.askFileSource('save').then((dest) => {
        if (dest === 'device') download(paths);
        else if (dest === 'vfs') {
          const files = paths.map((p) => FS.stat(p)).filter((st) => st && st.type === 'file').map((st) => st.path);
          if (!files.length) { MH.toast('Select a file to copy — folders can only be downloaded as a ZIP.'); return; }
          MH.vfsPick({ title: 'Save to a proton folder', save: true, folder: true }).then((destDir) => {
            if (destDir) copyInto(destDir, files);
          });
        }
      });
    };
    q('#fm-delete').onclick = () => {
      const paths = selected().filter((p) => FS.isWritable(p));
      if (paths.length) remove(paths);
      else MH.toast('Nothing here can be deleted — the proton system tree is read-only.');
    };
    q('#fm-select-all').onclick = () => { entries().forEach((e) => sel.add(e.path)); anchor = null; draw(); };
    q('#fm-clear').onclick = () => { results = null; q('#fm-search').value = ''; draw(); };

    /* Other apps and the desktop can point Files at a folder or a file. */
    body.openPath = ({ path, select: pick } = {}) => {
      closeMenu();
      results = null;
      if (path) cwd = folderOr(path, cwd);
      if (pick) {
        const st = FS.stat(FS.normalize(pick));
        if (st) { cwd = st.type === 'dir' ? st.path : FS.dirname(st.path); sel.clear(); sel.add(st.path); anchor = st.path; }
      } else sel.clear();
      draw();
    };
    body.onDestroy = () => { closeMenu(); unwatch(); };

    /* ------------------------------- start ------------------------------ */
    draw();
    if (options.select) body.openPath({ select: options.select });
    else if (options.path && FS.stat(FS.normalize(options.path))?.type === 'file') {
      const path = FS.normalize(options.path);
      sel.add(path); anchor = path;
      draw();
    }
    q('#fm-scroll').focus({ preventScroll: true });
  },
});
</script>
</body>
</html>
